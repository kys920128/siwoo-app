<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고슴이 — 놀이와 이유식 육아기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FBF3E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#FBF3E7; --card:#FFFFFF; --ink:#4A392E; --sub:#836A5F; --line:#F2E3CF;
  --peach:#FFC79E; --peach2:#FFB38A; --coral:#D95632; --mint:#C4E7D2; --mint2:#9BD8B6;
  --sky:#C4DEF2; --butter:#FFE9B3; --pink:#FBD3D0; --lav:#E3D9F2;
  --clay:0 5px 0 rgba(190,148,104,.28), 0 10px 24px rgba(190,148,104,.16);
  --clay-s:0 3px 0 rgba(190,148,104,.22), 0 6px 14px rgba(190,148,104,.12);
  --r:22px; --ok:#3E8E5F;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#231C14; --card:#2F261C; --ink:#F6EADB; --sub:#BCA793; --line:#413524;
    --coral:#FF9A76; --ok:#7CCB9C;
    --clay:0 5px 0 rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.3);
    --clay-s:0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25);
  }
}
/* 🌙 밤중 모드 — 잠든 아기 옆에서 켤 수 있게 저휘도 적색 계열 (베이비엔젤이 검증한 패턴) */
body.night{ --bg:#140D09; --card:#1E1410; --ink:#E8C9B0; --sub:#A8836A; --line:#33231A;
  --peach:#8A5A3C; --peach2:#7A4E33; --coral:#C97A55; --mint:#3E5A48; --mint2:#4A6B55;
  --sky:#3A4A5A; --butter:#5A4A28; --pink:#5A3630; --lav:#453A55; --ok:#6FA588;
  --clay:0 4px 0 rgba(0,0,0,.5); --clay-s:0 2px 0 rgba(0,0,0,.45);
  filter:brightness(.82) sepia(.18); }
body.night img,body.night svg{filter:brightness(.9)}
/* 근거 등급 배지 — 이 앱의 성격 */
.evb{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;
  margin-left:5px;vertical-align:middle;cursor:pointer;letter-spacing:.3px;line-height:1.6}
.gchart{width:100%;height:auto;display:block;touch-action:pan-y}
.qbtn{border:none;border-radius:16px;padding:11px 8px;font-family:inherit;font-weight:800;font-size:13px;
  cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--clay-s);
  display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25}
.qbtn .e{font-size:19px}
.qbtn:active{transform:translateY(2px);box-shadow:none}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sleepbar{height:22px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.sleepbar>i{position:absolute;top:0;bottom:0;background:var(--sky);opacity:.95}
.sleepbar>i.nap{background:var(--butter)}
.bandwrap{position:relative;height:30px;border-radius:10px;background:var(--line);overflow:hidden;margin:6px 0}
.bandwrap>.band{position:absolute;top:0;bottom:0;background:var(--mint);opacity:.55}
.bandwrap>.mk{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--coral);border-radius:2px}

/* 접근성 — 모션 민감 사용자 존중 (WCAG 2.3.3) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  .mascot.b{animation:none !important}
}
/* 키보드 포커스 — 없애지 않고 또렷하게 */
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
/* 작은 글씨 하한 */
.small{font-size:12.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.62}
.hd,h1,h2{font-family:'Jua','Nunito',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:14px 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px;
  display:flex;align-items:center;justify-content:space-between}
header.top .t{font-size:20px}
header.top .sub{font-size:12px;color:var(--sub);font-weight:700}
.gear{background:var(--card);border:2px solid var(--line);border-radius:14px;width:44px;height:44px;
  cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;box-shadow:var(--clay-s)}
nav.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;background:var(--card);
  border:2px solid var(--line);display:flex;width:min(452px,calc(100% - 24px));
  border-radius:24px;box-shadow:var(--clay);padding:4px}
nav.bottom button{flex:1;background:none;border:none;padding:8px 0 6px;cursor:pointer;
  color:var(--sub);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;border-radius:18px;transition:background .18s}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--coral);background:var(--bg)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:var(--clay-s)}
.card.pop{box-shadow:var(--clay)}
.chip{display:inline-block;background:var(--bg);border-radius:999px;padding:3px 11px;
  font-size:12px;color:var(--sub);margin:0 6px 6px 0;font-weight:800}
.chip.c1{background:var(--peach);color:#5A3A22}
.chip.c2{background:var(--mint);color:#2A5940}
.chip.c3{background:var(--sky);color:#2C4A66}
.chip.c4{background:var(--butter);color:#6B5518}
.chip.c5{background:var(--pink);color:#7A3A36}
.chip.c6{background:var(--lav);color:#4C3B6E}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:13.5px;margin:16px 0 6px;color:var(--sub);font-weight:800;font-family:'Nunito',sans-serif}
.big{font-size:19px;margin:2px 0 6px}
.sub{color:var(--sub);font-size:13.5px}
.small{font-size:12.5px;color:var(--sub)}
button.pri,button.sec{width:100%;border:none;border-radius:18px;padding:14px;font-size:16px;
  font-weight:800;cursor:pointer;font-family:inherit;color:#5A3A22;transition:transform .12s, box-shadow .12s}
button.pri{background:var(--peach);box-shadow:0 4px 0 rgba(190,120,70,.45)}
button.sec{background:var(--butter);box-shadow:0 4px 0 rgba(190,150,60,.35)}
button.pri:active,button.sec:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(190,120,70,.45)}
button.ghost{background:none;border:none;color:var(--coral);font-size:14px;cursor:pointer;min-height:44px;
  padding:8px 0;font-family:inherit;font-weight:800}
.row{display:flex;gap:10px}.row>*{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);
  border-radius:18px;padding:13px 14px;margin-bottom:10px;font-size:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);font-weight:700;transition:border-color .15s}
.opt .d{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:600}
.opt.on{border-color:var(--coral);background:var(--bg)}
input,textarea,select{width:100%;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px;font-family:inherit}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--sub);margin:13px 0 5px;font-weight:800}
.notice{background:var(--sky);color:#2C4A66;border-radius:16px;padding:12px 14px;font-size:13.5px;margin:12px 0;font-weight:600}
.notice.warm{background:var(--pink);color:#7A3A36}
.notice.mint{background:var(--mint);color:#2A5940}
@media (prefers-color-scheme: dark){
  .notice{background:#2C3E52;color:#CBE0F2}.notice.warm{background:#4A2E2C;color:#F2CBc7}.notice.mint{background:#2A4436;color:#C6E8D4}
  .chip.c1{background:#5A3A22;color:#FFC79E}.chip.c2{background:#2A5940;color:#C4E7D2}.chip.c3{background:#2C4A66;color:#C4DEF2}
  .chip.c4{background:#6B5518;color:#FFE9B3}.chip.c5{background:#7A3A36;color:#FBD3D0}.chip.c6{background:#4C3B6E;color:#E3D9F2}
  button.pri{color:#5A3A22}button.sec{color:#6B5518}
}
.divider{height:2px;background:var(--line);margin:14px 0;border-radius:2px}
.playline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pnum{color:var(--sub);font-size:13px;font-weight:800}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .lab{width:100px;font-size:13.5px;font-weight:700}
.bar-row .track{flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
.bar-row .fill{height:100%;background:var(--peach2);border-radius:8px;min-width:3px}
.bar-row .val{width:44px;text-align:right;font-size:12.5px;color:var(--sub);font-weight:700}
.emobtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);
  border:2.5px solid var(--line);border-radius:18px;padding:12px 4px;cursor:pointer;flex:1;
  font-family:inherit;color:var(--ink);font-size:11.5px;font-weight:800}
.emobtn .e{font-size:26px}
.emobtn.on{border-color:var(--coral);background:var(--bg)}
.condbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);margin:0 6px 8px 0;font-weight:700}
.condbtn.on{border-color:var(--coral);background:var(--pink);color:#7A3A36}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--sub);font-size:11px;padding:4px 0;font-weight:800}
.cal .d{padding:8px 0;border-radius:12px;cursor:pointer;position:relative;font-weight:700}
.cal .d.dot::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--coral)}
.cal .d.sel{background:var(--peach);color:#5A3A22}
.cal .d.today{outline:2.5px solid var(--peach2)}
.logitem{border-left:4px solid var(--peach2);padding:6px 0 6px 12px;margin:10px 0;border-radius:2px}
.logitem .dt{font-size:12px;color:var(--sub);font-weight:800}
.mile{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:2px solid var(--line);cursor:pointer}
.mile:last-child{border-bottom:none}
.mile .nm{font-size:14.5px;font-weight:700}
.mile .st{font-size:12.5px;color:var(--sub);font-weight:700}
.mathbox{background:linear-gradient(135deg,var(--lav),transparent);border:2px dashed #B49CD9;
  border-radius:18px;padding:13px 14px;margin:12px 0;font-size:14px}
.mathbox .tt{font-weight:800;color:#7A5FA8;font-size:13px;margin-bottom:6px}
@media (prefers-color-scheme: dark){ .mathbox{background:linear-gradient(135deg,#3A2F52,transparent)} .mathbox .tt{color:#C9B4EC} }
.srcbox{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-top:12px;font-weight:600}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:12px 14px;font-size:14.5px;box-shadow:var(--clay-s);font-weight:700}
.bubble::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--card);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hero{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.hero .mascot{flex:0 0 74px}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot.b{animation:bounce 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .mascot.b{animation:none} .fade{animation:none} }
.hidden{display:none!important}
#printArea{display:none}
@media print{ #app{display:none} #printArea{display:block;font-size:12px;color:#000}
  #printArea h1{font-size:18px}#printArea h2{font-size:14px;margin:14px 0 4px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td,#printArea th{border:1px solid #999;padding:4px 6px;text-align:left;font-size:11px}}
.stChip{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:800}
.stChip.ok{background:var(--mint);color:#2A5940}
.stChip.tmp{background:var(--pink);color:#7A3A36}
.footer-note{font-size:12px;color:var(--sub);text-align:center;margin:18px 4px 6px;line-height:1.7;font-weight:600}
.foodItem{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:2px solid var(--line);cursor:pointer}
.foodItem:last-child{border-bottom:none}
.foodItem .nm{font-weight:800;font-size:15px}
.foodItem .tag{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;border-radius:999px;padding:2px 9px;font-weight:800}
.badge.ok{background:var(--mint);color:#2A5940}
.badge.al{background:var(--butter);color:#6B5518}
.badge.watch{background:var(--sky);color:#2C4A66}
.badge.warn{background:var(--pink);color:#7A3A36}
.mealcell{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0;font-size:13.5px;cursor:pointer;font-weight:700}
.mealcell .mt{font-size:11px;color:var(--sub);font-weight:800}
.shopbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:800;box-shadow:var(--clay-s)}
.dday{display:flex;align-items:center;gap:10px}
.dday .n{font-family:'Jua';font-size:26px;color:var(--coral)}
a{color:var(--coral)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><div class="t hd" id="hTitle">고슴이</div><div class="sub" id="hSub"></div></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="stChip" class="stChip tmp">확인 중</span>
      <button class="gear" onclick="go('settings')" aria-label="설정">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="nav" aria-label="주 메뉴">
    <button data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>오늘</button>
    <button data-v="plays" onclick="go('plays')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a5 5 0 0 1 0 9 5 5 0 0 0 0 9"/><circle cx="12" cy="7.5" r="1" fill="currentColor"/><circle cx="12" cy="16.5" r="1" fill="currentColor"/></svg>놀이</button>
    <button data-v="food" onclick="go('food')"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 11V7a3 3 0 0 1 6 0"/><path d="M8 21h8"/><path d="M12 19v2"/></svg>이유식</button>
    <button data-v="log" onclick="go('log')"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>기록</button>
    <button data-v="map" onclick="go('map')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>지도</button>
  </nav>
</div>
<div id="printArea"></div>
<script>
/* ============ 데이터 ============ */
const PLAYS = [{"n": 1, "name": "흑백 초점책, 한 면씩", "m": 0, "dom": "인지", "dom2": null, "math": 0, "label": "[CDC 2개월] 「수 초 동안 장난감을 본다」 · 10명 중 7~8명 이상 · 신생아도 시도 가능", "mat": "흑백 초점책", "how": "아기 눈 위에 한 면만 편다. **아기가 눈을 돌리면 그때가 끝**이다.", "down": "도형이 하나만 있는 면으로. 더 가까이.", "up": "두 면을 나란히 놓고 어느 쪽을 먼저 보는지 본다.", "warn": "안 볼 때 얼굴 앞에 들이대지 마십시오. 그건 자극이 아니라 방해입니다.", "src": [8, 13, 17], "srcRaw": "D8, D13, D17 — D8에서 마름모를 보다 자세를 바꿔 패턴을 보고 잠들었고, D17에는 하품과 칭얼거림이 나와 중단했습니다."}, {"n": 2, "name": "어느 쪽을 먼저 보나", "m": 0, "dom": "인지", "dom2": null, "math": 1, "label": "[CDC 2개월] 「수 초 동안 장난감을 본다」 · 10명 중 7~8명 이상", "mat": "초점책 (도형이 다른 두 면)", "how": "왼쪽에 물결무늬, 오른쪽에 마름모를 놓는다. 아기 얼굴 정중앙에서 시작한다. **어느 쪽을 먼저, 얼마나 오래 보는지**만 본다.", "down": "두 개가 아니라 하나만. 대비가 강한 것으로.", "up": "**좌우를 바꿔 다시 한다.** 같은 도형을 고르면 도형 선호, 같은 방향을 고르면 방향 선호다.", "warn": "**이게 이 앱의 핵심 동작입니다.** 좌우를 바꾸는 순간 놀이가 관찰이 됩니다.", "src": [11, 13], "srcRaw": "D11, D13 — D13에서 아기가 처음 놓인 물결무늬를 **외면하고 스스로 고개를 돌려** 마름모를 찾아 3분간 봤습니다.", "mathEye": {"seed": "도형 비교 · 통제변인", "now": "물결무늬와 마름모 중 어느 쪽을 먼저 보는지 봅니다.", "later": "좌우를 바꿔 다시 해보는 것 — 이게 통제변인입니다. 위치를 바꿔도 같은 도형을 고르면 도형을 본 것입니다.", "watch": "좌우를 꼭 바꿔보세요. 안 바꾸면 아무것도 알 수 없습니다."}}, {"n": 3, "name": "읽어주다 자리 옮기기", "m": 0, "dom": "언어", "dom2": "인지", "math": 1, "label": "[CDC 4개월] 「사람의 목소리가 나는 쪽을 향해 고개를 돌린다」 · 10명 중 7~8명 이상", "mat": "아무 책", "how": "책을 읽어주다 **읽는 자리를 옮긴다.** 아기가 소리 쪽으로 고개를 돌리는지 본다.", "down": "가까이서. 목소리를 조금 크게.", "up": "방 반대편으로. 또는 엄마가 반대편에서 등장해 주의가 옮겨가는지 본다.", "warn": "고개를 돌렸다고 **말을 알아들은 게 아닙니다.** 소리 나는 쪽을 본 것입니다. 이름 반응은 놀이 43에서 따로 확인합니다.", "src": [14, 26], "srcRaw": "D14, D26 — D14에서 딸꾹질 중에도 아빠 쪽으로 고개를 돌렸고, 엄마가 등장하자 주의가 엄마로 옮겨갔습니다.", "mathEye": {"seed": "방향", "now": "소리가 오는 방향으로 고개를 돌립니다.", "later": "수학에서 좌표를 배우기 훨씬 전에, 아기는 자기 몸을 원점으로 쓰는 법부터 익힙니다. (신생아기의 방향 반응은 반사일 수 있습니다.)", "watch": "방향을 바꿀 때 얼마나 정확히 도는지 보세요."}}, {"n": 4, "name": "책 읽어주기 (기저귀 갈고 나서)", "m": 0, "dom": "언어", "dom2": "사회정서", "math": 0, "label": "CDC 이정표 없음 · 언제 시작해도 좋음", "mat": "아무 책", "how": "**기저귀를 갈고 배부른 뒤에** 읽는다. **처음 3분은 반응이 없는 게 정상**이다.", "down": "그림만 보여준다. 목소리 톤만 유지한다.", "up": "대화하듯 읽는다. 칭얼거릴 때 톤을 바꾸면 다시 집중하기도 한다.", "warn": "우는 건 책이 싫어서가 아니라 **배가 고파서**인 경우가 많습니다.", "src": [9, 12, 20, 25], "srcRaw": "D9, D12, D20, D25 — D9에서 「초기 3분 무반응(Warm-up)」이 기록됐고, D25에서 칭얼거릴 때 대화체로 바꾸자 집중이 돌아왔습니다."}, {"n": 5, "name": "배 위 터미타임", "m": 0, "dom": "신체", "dom2": "사회정서", "math": 0, "label": "[CDC 2개월] 「배를 대고 엎드렸을 때 머리를 치켜든다」 · 10명 중 7~8명 이상", "mat": "없음 (부모 가슴)", "how": "부모가 눕고 아기를 가슴 위에 엎드려 올린다. **깨어 있을 때만.** 아기가 힘들어하면 끝낸다.", "down": "부모 상체를 더 비스듬히 세운다.", "up": "바닥 매트에서. 눈앞에 볼 것을 놓아준다.", "warn": "**절대 눈을 떼지 마십시오. 잠들면 즉시 바로 눕히십시오.** (일반 안전 지침)", "src": [21, 24], "srcRaw": "D21, D24 — D24에서 고개를 뒤로 젖혀 아빠와 눈을 맞추려 했습니다."}, {"n": 6, "name": "경사면 터미타임", "m": 0, "dom": "신체", "dom2": null, "math": 0, "label": "[CDC 2개월] 「배를 대고 엎드렸을 때 머리를 치켜든다」 · 10명 중 7~8명 이상", "mat": "쿠션 또는 수유쿠션", "how": "완만한 경사에 아기 상체를 올려 엎드리게 한다. 앞에 볼 것을 둔다.", "down": "경사를 더 세운다. 목욕 직후에 한다.", "up": "평지 매트로 옮긴다.", "warn": "경사가 급하면 얼굴이 파묻힙니다. **어깨가 엉덩이보다 확실히 높기만 하면 됩니다.** (일반 안전 지침)", "src": [27, 32], "srcRaw": "D27, D32 — D27에서 경사면 덕에 수월하게 고개를 들고 인형을 봤고, D32에서 45도를 들어 사슴을 안정적으로 봤습니다."}, {"n": 7, "name": "손에 쥐어보기", "m": 0, "dom": "신체", "dom2": "인지", "math": 0, "label": "[CDC 4개월] 「손에 장난감을 놓으면 그것을 쥔다」 · 10명 중 7~8명 이상", "mat": "작은 공, 또는 부모 손가락", "how": "아기 손바닥에 공을 대준다. **손가락이 곡면을 따라 어떻게 펴지는지** 본다.", "down": "더 가느다란 것(손가락)으로.", "up": "크기가 다른 것 두 개를 번갈아. 쥐는 모양이 달라지는지 본다.", "warn": "일반적으로 이 시기 쥐기는 파악반사로 설명됩니다. **다만 시우 기록은 다르게 적혀 있습니다.** D21에 \"공의 곡면을 따라 손가락을 펴서 감싸 쥐는 정교한 파지\", D30에 \"쥐는 힘을 조절\"이 남아 있습니다. 반사인지 조절인지는 **크기가 다른 것을 줘봐야** 갈립니다. 그게 ↑입니다.", "src": [21, 30], "srcRaw": "D21, D30"}, {"n": 8, "name": "불 끄기", "m": 0, "dom": "사회정서", "dom2": null, "math": 0, "label": "CDC 이정표 없음 · 환경 조절", "mat": "조명", "how": "칭얼거림이 이유 없이 계속될 때 **불을 끈다.** 다른 건 아무것도 하지 않는다.", "down": "완전 소등이 부담되면 간접등만.", "up": "낮에도 암막을 쳐본다.", "warn": "자극을 더 주는 게 답이 아닐 때가 많습니다. **빼는 게 답입니다.**", "src": [20], "srcRaw": "D20 — 칭얼거림이 심했으나 불을 끄자 즉시 잠들었습니다."}, {"n": 9, "name": "모빌 (흑백 → 컬러)", "m": 1, "dom": "인지", "dom2": null, "math": 0, "label": "[CDC 2개월] 「움직임에 따라 상대를 주시한다」 · 10명 중 7~8명 이상", "mat": "모빌", "how": "처음엔 흑백. 반응이 뚜렷해지면 컬러를 섞는다. 회전은 **가장 느리게**.", "down": "회전을 멈추고 정지 상태로.", "up": "인형 하나만 남기고 나머지를 뗀다. 그 하나를 좋아하는지 본다.", "warn": "**15분을 넘기지 마십시오.** D19에 15분 추적 후 하품하고 잠든 기록이 있고, 선생님이 이걸 「15분의 법칙」이라 부르셨습니다.", "src": [19, 22, 29, 31], "srcRaw": "D19, D22, D29, D31 — D31에서 주황색 사슴에 유독 긴 응시를 보였습니다."}, {"n": 10, "name": "색 맞추기 (책 속 색 ↔ 실물)", "m": 1, "dom": "인지", "dom2": null, "math": 1, "label": "[CDC 2개월] 「움직임에 따라 상대를 주시한다」 · 10명 중 7~8명 이상", "mat": "색이 선명한 그림책 + 같은 색 모빌·인형", "how": "책의 무지개색을 보여준 뒤, **같은 색 실물**을 보여준다. 시선이 오가는지 본다.", "down": "색을 하나만. 대비가 큰 색으로.", "up": "색을 두세 개로 늘린다. 좋아하는 색을 찾는다.", "warn": "색을 「안다」는 뜻이 아닙니다. **같은 색에 시선이 머무는지**만 보는 것입니다.", "src": [39], "srcRaw": "D39 — 「엉망진창 무지개」를 읽어준 뒤 책 속 색과 사슴 모빌 색을 매칭하며 응시했습니다.", "mathEye": {"seed": "같음 판단 · 분류", "now": "책 속 색과 실물 색 사이를 시선이 오가는지 봅니다.", "later": "「이것과 저것이 같다」는 판단이 분류의 시작입니다. 수를 세려면 먼저 무엇을 셀지 정해져야 하고, 그걸 정하는 게 분류입니다.", "watch": "색을 안다고 기대하지 말고, 시선이 두 곳을 오가는지만 보세요."}}, {"n": 11, "name": "사라졌다 나타나기", "m": 1, "dom": "인지", "dom2": "사회정서", "math": 0, "label": "[CDC 12개월] 「담요 밑의 장난감을 찾듯이 숨기는 것을 찾는다」 · **1개월엔 「불안 → 안도」 수준**", "mat": "아기가 좋아하는 인형", "how": "좋아하는 인형을 **손으로 가린다.** 잠깐. 다시 보여준다. 표정 변화를 본다.", "down": "반쯤만 가린다.", "up": "가리는 시간을 늘린다. 가린 뒤 다른 자리에서 나타나게 한다.", "warn": "**가린 걸 손으로 찾아내는 건 12개월 무렵입니다.** 지금은 「없어지면 불안, 나타나면 안도」면 충분합니다.", "src": [34], "srcRaw": "D34 — 사슴이 가려지면 불안해하다 다시 나타나면 즉시 안도했습니다."}, {"n": 12, "name": "상·하·좌·우", "m": 1, "dom": "언어", "dom2": "인지", "math": 1, "label": "[CDC 4개월] 「사람의 목소리가 나는 쪽을 향해 고개를 돌린다」 · 10명 중 7~8명 이상", "mat": "없음", "how": "아기 위·아래·왼쪽·오른쪽으로 자리를 옮기며 **\"위!\" \"아래!\"**를 말한다.", "down": "좌우 두 방향만. 각도를 줄인다.", "up": "영어를 섞는다(\"Up!\"). 소리 없이 얼굴만 움직여본다.", "warn": "못 따라오면 각도를 줄이십시오.", "src": [47, 115], "srcRaw": "D47, D115 — D47에서 \"상/하/좌/우\"에 맞춰 고개를 정확히 돌리며 즐거워했고, D115에서 특정 음성(\"Up\")에 강한 반응을 보였습니다.", "mathEye": {"seed": "좌표축", "now": "위·아래·좌·우, 방향에 이름이 붙 const DAILY = {"8": {"i": "흑백 초점책 (마름모 속 사각형 vs 반복 패턴)", "o": "마름모(단일 도형) 응시 → 자세 변경 → 패턴 응시 → 수면"}, "9": {"i": "기저귀 교체(쾌적함) 후 독서 시도", "o": "초기 3분 무반응(Warm-up) → 중반 관심 보임 → 후반 공복감으로 중단"}, "10": {"i": "수유 시 클래식 음악 노출, 그 외 휴식 제공", "o": "먹고 자는 패턴의 무한 반복(Eat-Sleep Cycle). 깨어있는 시간 거의 없음."}, "11": {"i": "곡선(원) vs 직선(다각형) 선호도 및 추적 실험", "o": "동그라미 위주의 시선 추적(Tracking) 확인. 눈동자에 원이 비치는 현상 관찰. 이후 수면 진입."}, "12": {"i": "인위적 자극 배제 및 생리적 욕구 충족 주력", "o": "먹고 자는 패턴의 무한 반복. 깨어있는 시간 거의 없음."}, "13": {"i": "초점책 넓게 펼쳐 제시 (초기값: 물결/별 vs 실제값: 마름모 패턴)", "o": "초기 배치(물결)를 외면하고 스스로 고개를 돌려 '마름모 패턴'을 찾아 3분간 응시."}, "14": {"i": "백설공주' 낭독 중 낭독자(아빠) 위치 이동 및 엄마 등장", "o": "· 딸꾹질 중에도 소리 나는 쪽(아빠)으로 고개를 돌려 시선 추적(Sound Localization).  · 엄마 등장 시 아빠에게서 엄마로 주의 전환(Attention Switching)."}, "15": {"i": "연구자(아빠)의 건강 악화로 인한 접촉 최소화", "o": "깊은 수면 상태 유지 (수면 방해하지 않음)"}, "16": {"i": "왕비와 거울' 낭독 중 시각적 방해물(책) 제거 실험", "o": "소리에 반응했으나 시선은 책/카메라에 고정. 책을 숨기자 아빠와 아이컨택 성공."}, "17": {"i": "만만디의 우연한 모험' 낭독", "o": "눈을 감고 외면하다(회피) 급격한 안면 홍조와 함께 울음 폭발."}, "18": {"i": "조리원 퇴소 전일, 별도 자극 없이 수면 위주 생활", "o": "깨어있는 시간 최소화."}, "19": {"i": "집 도착 후 '타이니 모빌(흑백)' 첫 가동", "o": "15분간 회전하는 인형을 추적(Tracking)하다 하품 후 수면."}, "20": {"i": "새벽 독서 및 기저귀 교체, 이후 '소등' 실험", "o": "칭얼거림이 심했으나 '불을 끄자(Darkness)' 즉시 수면 진입."}, "21": {"i": "작은 공 쥐어보기 (Grip Test)", "o": "공의 곡면을 따라 손가락을 펴서 감싸 쥐는 정교한 파지 성공."}, "22": {"i": "우드(유색/질감) 모빌 노출", "o": "흑백이 아닌 나무 모빌에도 관심을 보임."}, "23": {"i": "수면 중 '시골 극장 레벤다' 낭독", "o": "미동 없이 수면 유지."}, "24": {"i": "콩/깨 소리 vs 공 움직임", "o": "소리엔 무반응, 시각(공) 자극엔 고개 돌려 추적."}, "25": {"i": "회색 곰의 딸' 낭독 중 대화체 전환", "o": "칭얼거림 발생 시 대화하듯 읽어주자 집중력 회복 및 완독."}, "26": {"i": "미카의 하루' 낭독 및 카메라 제거", "o": "엄마를 보던 중 아빠 목소리에 고개를 돌림. 카메라 제거 시 집중 향상."}, "27": {"i": "목욕 후 경사면 위 터미타임", "o": "경사면을 활용해 수월하게 고개를 들고 인형 응시."}, "28": {"i": "간절히 원하는 아이' 낭독 및 위치 이동", "o": "카메라/아빠에게 시선 고정 시, 다른 자극에 반응하지 못함."}, "29": {"i": "타이니모빌 컬러 인형 노출 시작", "o": "컬러 모빌의 움직임에 시선을 고정하고 집중하기 시작함."}, "30": {"i": "공 잡기 시도 및 초점책 놀이", "o": "손에 닿는 공의 질감을 느끼며 쥐는 힘을 조절하고 초점책에 몰입함."}, "31": {"i": "주황색 사슴 모빌 집중 노출", "o": "주황색 사슴에 유독 강한 애착과 긴 응시 시간을 보임."}, "32": {"i": "역방향 쿠션 위 터미타임", "o": "고개를 45도 들어 정면의 사슴을 안정적으로 응시함."}, "33": {"i": "아빠 가슴 위 밀착 교감 및 발성", "o": "아빠를 보며 **쿠잉(Cooing)**을 하고 아빠의 모방에 미소로 화답함."}, "34": {"i": "선호 모빌 가리기/보여주기 실험", "o": "사슴이 가려지면 불안해하다가 다시 나타나면 즉시 안도함."}, "35": {"i": "복합 자극(까꿍책 + 부모 육성)", "o": "모빌에 집중하다가도 부모의 목소리에 즉각 고개를 돌림."}, "37": {"i": "초점책 노출 중 공복 자극 발생", "o": "배고픔으로 울음 발생 시 즉시 활동을 중단하고 수유로 전환."}, "38": {"i": "시/청각 복합 자극(모빌)", "o": "모빌을 보며 명확한 사회적 미소를 짓고 침 분비량이 증가함."}, "39": {"i": "[엉망진창 무지개] 독서 & 실물 연계", "o": "책 속 무지개색을 보고 사슴 모빌의 색상과 매칭하며 응시함."}, "41": {"i": "뒤집기 시범 및 신체 보조(Scaffolding)", "o": "몸이 완전히 뒤집히지 않자 낑낑대며 짜증과 분노를 표출함."}, "42": {"i": "평지 매트 위 자율 터미타임", "o": "도움 없이 고개를 90도 가까이 세우고 주변(강아지 등)을 탐색함."}, "45": {"i": "[눈코입] 독서 및 신체 부위 접촉 놀이", "o": "아빠의 얼굴을 손으로 만지며 책 속의 부위와 일치시킴."}, "46": {"i": "의도적 잡기 및 쥐기 훈련", "o": "물체나 아빠의 손가락을 의지적으로 쥐고 힘을 유지함."}, "47": {"i": "4방향 시각 추적 및 방향 어휘 자극", "o": "\"상/하/좌/우\" 말에 맞춰 고개를 정확히 회전하며 즐거워함."}, "48": {"i": "아기 체육관 피아노 건반 노출", "o": "발버둥 중 우연히 건반을 눌러 소리가 나자 흥미를 보임. 주로 오른발 사용."}, "49": {"i": "사슴 모빌 손 타격 및 아기체육관", "o": "손을 뻗어 모빌을 치고 웃음. 건반을 전날보다 더 잘 다루기 시작함."}, "50": {"i": "아기 체육관 거리 조절 및 관찰", "o": "음악이 끝나면 이어서 누름(의지적 시도). 까치발을 해서라도 건반을 누름."}, "51": {"i": "1m 원거리 모빌 노출", "o": "1m 밖 모빌을 응시하며 웃고 쿠잉함. 전체적인 쿠잉 횟수가 급증함."}, "52": {"i": "모빌에 고리를 달아 조작 유도", "o": "고리를 손으로 잡고 모빌을 조작하며 소근육 발달을 꾀함."}, "53": {"i": "[해님 안녕 달님 안녕] 및 천문학 지식", "o": "아빠 얼굴보다 책의 그림을 응시하며 고도의 집중력을 보임."}, "54": {"i": "자율적 모빌 고리 잡기", "o": "잡아주지 않아도 스스로 고리를 낚아채 조작함. 손가락 활용 정교화."}, "55": {"i": "설날 외가 방문 및 집안 구경", "o": "낯선 공간을 두리번거리며 구경함. 아빠의 공간 설명을 경청함."}, "56": {"i": "주변 사물 인지 및 표정 모방", "o": "달력, 사진을 뚫어지게 봄. 부모의 웃는 표정을 따라 웃음."}, "57": {"i": "촉감 그림책(동물 털) 노출 및 모빌 조작", "o": "· 동물 털을 만지며 생소한 질감을 탐색함.  · 책 자체보다 읽어주는 부모의 얼굴에 우선적으로 반응함.  · 모빌을 툭툭 쳐서 움직임을 만든 후 쿠잉으로 화답함."}, "58": {"i": "50일 촬영 및 첫 외부 카페(스타벅스) 방문", "o": "· 차량 이동 및 낯선 다중 이용 시설에서 주로 수면을 취함. · 집안에서 엄마아빠의 움직임을 눈으로 쫓으며 위치를 추적함. · 벽면 달력 등 특정 지점을 정밀하게 관찰함."}, "59": {"i": "잠투정 상황에서의 3권 연속 독서 시도", "o": "· 울다가도 책을 펼치자 즉시 울음을 멈추고 그림에 집중함.   · 책이 끝나면 다시 보채며 다음 책을 요구하는 듯한 반응을 보임.   · 독서 중 풍성한 쿠잉(옹알이)으로 아빠와 상호작용함."}, "62": {"i": "원더윅스 의심 및 엄마의 독서 자극", "o": "낮잠을 거의 자지 못하고 보챘으나, 엄마가 책을 읽어주면 기분 좋은 듯 팔다리를 휘저음."}, "63": {"i": "자기 신체(오른손) 탐색 및 구강기 반응", "o": "자신의 오른손을 뚫어지게 응시하며(Hand-regarding), 손을 입에 넣고 빠는 빈도가 급격히 늘어남."}, "64": {"i": "외할머니와의 대면 및 발성 유도", "o": "단순 옹알이를 넘어 \"응응 아으앙냥\" 등 복합 음절 발성."}, "65": {"i": "모빌 관찰 및 직접 타격 조작", "o": "모빌을 보며 옹알이를 하고, 동시에 손으로 툭툭 치며 조작함."}, "66": {"i": "수면 패턴 안정 및 아빠 얼굴 촉각 탐색", "o": "밤중 1회 수유 후 통잠. 아빠 품에서 아빠의 얼굴을 손으로 만짐."}, "67": {"i": "부모의 언어적 반응 및 대화 시도", "o": "옹알이 급증. 부모의 말에 순서를 기다려 대답하듯 옹알거림."}, "68": {"i": "트립트랩 거치 및 아빠 수염 촉각 탐색", "o": "아빠 수염의 질감을 느끼며 쿠잉하고, 아빠의 말에 상호작용함."}, "69": {"i": "베이비카페 첫 방문 및 또래 노출", "o": "낯가림 없이 숙면하며, 깬 후 옹알이 양이 평소보다 급증함."}, "70": {"i": "모빌 조작 및 소리 추적 활동", "o": "· 모빌을 스스로 잡아당겨 입으로 가져가려 함(구강기 탐색).  · 장인어른의 소리 자극에 즉각적으로 시선을 이동하며 추적함."}, "71": {"i": "팔 휘두르기, 딸랑이 놀이, 순한 아기 테스트", "o": "팔을 격렬히 휘둘러 잠을 설치나 깨어있을 땐 잘 웃음. 얼굴 위 모빌 자극을 오래 인내함."}, "72": {"i": "아기체육관 모빌 조작 및 손 탐색", "o": "모빌을 의도적으로 당기려 하고, 자신의 손을 한참 응시함."}, "73": {"i": "뒤늦은 50일 기념 사진 촬영", "o": "촬영 중 고개를 가누고 버티는 힘이 또래보다 월등히 강하다는 전문가 평가를 받음."}, "74": {"i": "거울 놀이, 부모 표정/음성 모방", "o": "큰 눈 인형 선호. 아빠의 가짜 웃음과 발성을 모방함. 거울 속 아빠와 실제 아빠를 번갈아 봄."}, "75": {"i": "첫 문화센터 방문 및 베이비 마사지", "o": "다수의 낯선 사람 속에서 시각적 탐색을 즐기며, 마사지 자극을 안정적으로 수용함."}, "76": {"i": "대형 욕조 교체 및 목욕 중 하체 저항", "o": "· 신체 성장에 맞춰 더 큰 욕조로 환경을 확장함.  · 씻길 때 바닥을 발로 강하게 딛고 일어서려는 듯 버티는 모습을 보임."}, "77": {"i": "아빠의 개학(부재 증가) 및 잦은 수유 요구", "o": "· 7분 수유 후 45분 만에 다시 찾는 등 불규칙하고 잦은 보챔(Cluster feeding).  · 아빠 품보다 엄마 품에서 눈에 띄게 안정을 찾음."}, "78": {"i": "야근으로 인한 아빠와의 물리적 시간 감소", "o": "아빠가 안으면 울음을 터뜨리고, 주 양육자인 엄마가 안으면 즉시 울음을 그침."}, "79": {"i": "엄마와의 베이비카페 재방문", "o": "집 밖의 다양한 시청각 자극 및 타인과의 환경에 노출됨."}, "80": {"i": "주말 전담 육아 및 대화형 옹알이 출현", "o": "· 아빠 품에 금세 다시 적응하여 안정감을 찾음.  · 뚜렷한 발음은 아니나 상호작용을 의도하는 '대화형 옹알이' 시도."}, "81": {"i": "낱말 파티션 교육, 돌페어 방문, 피로 상태에서의 강제 목욕", "o": "· 낱말 그림과 아빠의 입 모양에 반응하여 폭발적인 옹알이(상호작용)를 보임.  · 낯선 돌페어 행사장에서 보챔 없이 평온함을 유지함.  · 피로가 누적된 저녁, 강제 목욕 후 아빠 얼굴을 쳐다보고 명확히 거부하며 심하게 욺."}, "82": {"i": "수유량 감소 및 소변량(배출) 체크", "o": "먹는 양은 줄었으나, 소변량은 정상 수준을 유지하며 건강상 이상 징후를 보이지 않음."}, "83": {"i": "카페 방문 및 낯선 타인 조우", "o": "엄마뿐만 아니라 카페의 낯선 사람에게도 낯가림 없이 적극적으로 옹알이를 쏟아냄."}, "84": {"i": "보챔 상황에서의 그림책 독서 자극", "o": "· 울며 칭얼대다가도 책을 보여주면 즉시 울음을 그치고 집중함.  · 고개를 이리저리 움직이며 책의 여러 부분을 능동적으로 탐색함.  · 청각(목소리)보다 시각(그림)에 선행하여 반응하며 옹알이가 급증함."}, "85": {"i": "아내의 수면 교육 및 아빠와의 저녁 유모차 산책", "o": "유모차에서 바깥 풍경을 관찰함. 산책이 수면 교육(생체 리듬)과 시각 발달에 긍정적 변수로 작용하길 기대함."}, "86": {"i": "또래 모임(터미타임) 및 일찍 앞당긴 수면 루틴", "o": "· 친구들과 함께 엎드려 서로를 관찰함.  · 아빠의 회식으로 목욕/수면을 앞당기자, 잠투정이 심해지고 새벽에 일찍 깸."}, "87": {"i": "자는 곳과 노는 곳의 공간 분리 노출", "o": "장소를 명확히 인식하여, 수면 공간과 놀이 공간에 따라 행동 양식(차분함 vs 활발함)을 다르게 보임."}, "88": {"i": "아빠 전담 육아 및 이중언어(Bilingual) 자극 놀이", "o": "\"가지! eggplant!\" 등 단어 끝마디의 리듬에 큰 즐거움을 표함. 주간의 과도한 흥분(과각성)이 야간 수면의 질을 저하시킴."}, "89": {"i": "은행 방문 (새로운 외부 환경 노출)", "o": "외출 시 조용했던 과거와 달리, 집에서 하듯 큰 소리로 옹알이하거나 울며 보챔."}, "90": {"i": "베이비카페 다인원(10명 이상) 또래 모임", "o": "집단 환경보다 주 양육자(엄마)와의 물리적 분리에 민감하게 반응하여 크게 욺. 다른 아기와 눈을 맞추며 폭발적인 옹알이를 발산함."}, "91": {"i": "퇴근 후 스킨십 및 긍정적 목욕 루틴 형성", "o": "목욕 전 아빠와의 맨살 스킨십 및 놀이로 긍정적 기분을 유도함. 목욕을 '놀이'로 인식하여 식사와 수면의 질이 상승함."}, "92": {"i": "천장 구석에 설치된 홈캠 (전자기기)", "o": "낮이나 밤, 주변에 사람이 없을 때도 먼 거리에 있는 홈캠의 렌즈를 정확히 응시하며 옹알이를 함."}, "93": {"i": "부부 동반 또래 모임 참석 (타 아동 관찰)", "o": "1개월 차이 나는 또래 아기의 월등한 대근육/소근육 발달(서기, 젖병 잡기 등)을 목격함."}, "94": {"i": "호수공원 산책 (유모차 → 아기띠 전환)", "o": "유모차에서 답답함을 느껴 아기띠로 안아주자, 탁 트인 시야로 세상을 관찰하며 폭발적으로 옹알이를 함."}, "95": {"i": "모빌 조작 및 자기 손 탐색", "o": "모빌을 예전보다 훨씬 자유자재로 조작하며 놀고, 그 과정에서 자신의 손을 번갈아 쳐다보며 인식함."}, "96": {"i": "문화센터 방문 및 배고픔 발생", "o": "낯선 환경에 금세 적응하여 잘 놀지만, 공복 상태가 되자 어김없이 크게 울며 보챔."}, "97": {"i": "낯선 타인 조우 및 3D 팝업북 노출", "o": "· 처음 보는 사람이나 낯선 자극에 고개를 갸우뚱하며 탐색함.  · 팝업북이 2D에서 3D로 입체화될 때 눈이 커짐.  · 아빠가 이를 반복 검증하자 동일한 놀람(시각 확장) 반응을 보임."}, "98": {"i": "연속적인 그림책 읽기 및 수면 패턴 분석", "o": "· 책에 고도의 집중력을 보이며, 중단 시 다른 책을 요구하며 보챔.  · 과도한 독서(시각 자극)가 야간 과각성으로 이어짐.  · 타 영아 대비 절대적인 수면 요구량이 적음을 확인(부모의 기질과 동일)."}, "99": {"i": "문화센터 단추 촉감 놀이 및 모빌 당기기", "o": "· 바닥에 깔린 다양한 모양의 단추를 손으로 쥐고 탐색함.  · 트립트랩에서 모빌을 어깨까지 강하게 당김.  · 뒤집기를 위한 신체 비틀기 시도가 빈번해짐."}, "100": {"i": "부모의 상호작용 및 주변 사물 노출", "o": "· 옹알이의 발음(음소)이 다양해지며 특정 단어를 모방하려는 뉘앙스를 보임.  · 사회적 웃음의 빈도가 크게 증가함.  · 장난감, 아빠 손 등 손에 잡히는 모든 것을 입으로 가져감(구강기 절정)."}, "101": {"i": "뒤집기 및 되집기 보조 연습", "o": "스스로 뒤집으려 용을 쓰며, 실패 시 짜증을 표출함. 아빠의 도움으로 뒤집기 성공 경험을 쌓음."}, "102": {"i": "전방위적 구강 탐색 (손, 장난감, 책 등)", "o": "손에 잡히는 모든 물체를 예외 없이 입으로 가져가 강렬하게 탐색함."}, "103": {"i": "고리 구강 탐색, 문화센터 터미타임 및 젖병 양손 파지", "o": "· 고리를 입에 넣음.  · 엎드려 강사에게 시선을 고정함.  · 젖병을 양손으로 모아 쥠."}, "104": {"i": "수면 지시에 대한 항의, 액체 매트 노출, 찬바람 산책", "o": "· 불만족 시 옹알이로 항의함.  · 매트를 만지지 않고 주시함.  · 서늘한 환경 산책 후 수면 질 향상."}, "105": {"i": "아빠 출근 시간(06시) 기상 및 각성 유지", "o": "새벽 6시 기상 후 재수면에 들지 않고 완전한 각성 상태를 유지함."}, "106": {"i": "문화센터 교구 촉감 놀이, 첫 비눗방울 관찰, 타액(침) 분비 증가", "o": "· 버섯 교구를 손으로 쥐고 적극적으로 탐색함.  · 허공을 떠다니는 비눗방울을 시선으로 쫓으며 멍하니 집중함.  · 최근 들어 입 주변으로 침을 흘리는 양이 눈에 띄게 급증함."}, "107": {"i": "매일 그림책 읽어주기 루틴 및 옹알이 발화", "o": "· 일상생활 중 옹알이의 빈도와 양이 폭발적으로 증가함.  · 투정을 부리다가도 책을 읽어주면 즉시 몰입하여 집중함."}, "108": {"i": "생애 첫 야시장 방문 및 벚꽃 구경", "o": "인파와 소음이 극심한 복잡계 환경 속에서도 평온하게 숙면을 취함."}, "109": {"i": "베이비카페 첫 수영 (허리 보행기 튜브), 야간 수면 장애", "o": "· 입수 직후 울며 거부하다가 점차 물의 부력에 적응함.  · 수영 후 밤에 과각성 상태로 극심하게 보챔.  · 태열 증상이 심해짐."}, "110": {"i": "이른 기상(07시), 문화센터 딸기 촉감놀이, 야간 놀람", "o": "· 기상 시간이 앞당겨짐(루틴 변화).  · 자다가 깜짝 놀라 깨며 자지러지게 우는 현상(야경증 전조) 발생.  · 태열 지속."}, "111": {"i": "모빌 조작(시야 확장) 및 아빠 손 구강 탐색", "o": "· 넓어진 시야각으로 모빌 전체를 조망하며 손으로 타격/조작함.  · 아빠의 손을 자신의 입으로 강하게 끌어당겨 구강 탐색을 진행함."}, "112": {"i": "온도 하강, 뒤집기 보조(하체 회전), 공간/형태 매핑 계획", "o": "· 실내 온도 하강 변수 투입 후 태열 감소.  · 아빠가 다리의 축을 살짝 돌려주면 상체를 이용하여 뒤집기에 성공함."}, "113": {"i": "뒤집기 보조, 젖병 파지, 바운서 반동, 완두콩 촉감놀이", "o": "· 젖병을 손가락이 아닌 손바닥 전체로 감싸 쥠.  · 바운서에서 강한 하체 근력으로 반동을 만들어냄.  · 외출 후 낮잠을 자지 못하고 극심한 과자극 보챔을 보임."}, "114": {"i": "친구 집 방문 및 합동 터미타임", "o": "· 또래 친구와 마주 본 상태에서 옹알이가 폭발함.  · 집에 귀가한 직후 다시 극심한 울음과 보챔이 시작됨."}, "115": {"i": "6방향 공간 벡터 자극 (이중언어), 패턴 관찰", "o": "· 아빠의 위치 변화에 따른 시선 추적 및 특정 음성(Up)에 강한 긍정 반응.  · 알록달록한 복합 패턴을 뚫어지게 응시(데이터 처리).  · 주 양육자 부재 인지 후 스스로 정서 조절 시도."}, "116": {"i": "중력 실험(손수건), 공감각적 독서 시연, 목 가누기 테스트", "o": "· 얼굴에 떨어진 손수건에 깜짝 놀람(중력의 물리적 타격감 경험).  · 책의 의성어/의태어를 아빠가 직접 몸으로 시연하자 자지러지게 웃음.  · 팔을 당겨 앉히는 테스트(Pull-to-sit) 시, 고개가 뒤로 젖혀지며 아직 완전한"}, "117": {"i": "45도 보조 목 가누기 연습, 그림책 읽기", "o": "· 수면 부족 상태에서 꾸벅꾸벅 졸며 칭얼거림.  · 평소 좋아하는 책에도 '웃음 섞인 울음'으로 반응함."}, "118": {"i": "주 양육자(엄마)가 준비한 애착인형(젤리캣) 제공", "o": "낯선 대상임에도 거부감 없이 품에 안고 얼굴을 부비며 구강/촉각 탐색을 진행함."}, "119": {"i": "일상적인 저녁 루틴 (독서, 뒤집기 보조, 목욕, 수면)", "o": "칭얼거리며 정서적 불안정(엔트로피 증가)을 보이다가도, 책을 읽어주면 즉시 울음을 그치고 집중함."}, "120": {"i": "병원 3곳 방문, 1시간 낮잠, 옹알이 폭발", "o": "· 과도한 외부 일정 후 1시간의 낮잠으로도 피로가 회복되지 않아 하품을 함.  · 옹알이의 빈도가 크게 늘고, 부모의 귀에 특정 단어처럼 들리는 발음이 섞여 나옴."}, "121": {"i": "어린이 서점 방문, 기하학(점/선/면) 책 구입", "o": "서점의 다양한 책을 탐색함. 부모 주도로 적분 개념의 기초가 되는 책을 선정 및 도입함."}, "122": {"i": "호명 반응 교차 검증 및 억양/음량에 따른 반응 테스트", "o": "· 방향을 바꿔 이름을 불렀을 때 우연적 반응임을 확인함 (의미 미부여).  · \"압~~빠!\"와 같이 억양과 크기가 과장된 청각 데이터에 더 큰 웃음을 보임."}, "123": {"i": "신형 아기체육관(피아노형) 도입", "o": "하체로 건반을 차며 소리와 빛의 반응을 즐기나, 특정 건반과 특정 소리를 1:1로 매핑하지는 못함."}, "124": {"i": "문화센터 방문, 또래 신체 비교, 독서 경험에 대한 부모의 가설 논쟁", "o": "· 또래 대비 키가 크고 팔다리가 길쭉한 신체적 특징(유전)을 확인.  · 책 읽어주기에 대한 지속적인 흥미 유지."}, "125": {"i": "기하학(점/선/면) 도서 노출, 바운서-아기체육관 조작", "o": "· 점→선→면으로 이어지는 적분 개념 도서에 흥미를 보임.  · 바운서에서 발로 체육관을 누르며, 고개를 들어 자신이 무엇을 누르는지 '시각적으로 확인'하려 함."}, "126": {"i": "퇴근 후 독서 루틴 유지", "o": "책에 대한 일관된 긍정적 반응 및 집중도 유지."}, "127": {"i": "분리 수면(공간 분리) 시작, 아기체육관 정밀 조작", "o": "· 낯선 수면 환경에 즉각 적응함.  · 고개를 들고 발로 찰 목표물(건반)을 눈으로 확인하며 조작함."}, "128": {"i": "친할머니 첫 대면, 특정 대상 응시 시 미간 찌푸림", "o": "· 낯선 대상에게 우호적 반응(기질).  · 사물을 뚫어지게 응시할 때 아빠와 똑같이 미간에 주름을 잡으며 생각에 잠김."}, "129": {"i": "100일 스튜디오 촬영, 행동 제약에 대한 항의", "o": "낯가림으로 오인했으나, 구강기 탐색(손 빨기)이나 원하는 자세가 제약될 때 짜증과 큰 소리로 항의하는 것임을 파악함."}, "130": {"i": "어둠 속(시각 차단)에서의 단독 놀이, 양육자(엄마)의 등장", "o": "· 시각 데이터가 차단된 상태에서 두 손을 모으고 인지적 탐색을 진행함.  · 평온하게 있다가 엄마가 방에 진입하자 그제서야 울며 보챔."}, "131": {"i": "아빠와의 첫 문화센터 동반, 강사의 음성 자극", "o": "· 익숙한 장소(문센)이나 동반자(아빠)가 바뀌자 불안감(울음)을 표출함.  · 낯선 환경에서도 강사가 말을 할 때 그 화자를 뚫어지게 응시함."}, "132": {"i": "· 아쿠아플라넷 수조 관람  · 구강 탐색(손 빨기) 물리적 차단  · 엎드린 자세에서 되집기 보조", "o": "· 수조의 움직이는 생물과 빛을 향해 시선을 장시간 고정함.  · 손을 강제로 빼거나 눕혀줄 때 즉각적으로 짜증과 투정을 부림."}, "133": {"i": "4개월 차 수면 퇴행기 진입, 일상적 수면 루틴 제공", "o": "기존 입면 시간에 잠들지 못하고 각성함. 수면 궤도 이탈 및 칭얼거림의 반복."}, "134": {"i": "· 문화센터 동화 구연 및 시각 자극(쫄대 비)  · 아빠의 조기 퇴근으로 인한 상호작용 절대 시간 증가  · 혐오 자극(머리 감기) 투입", "o": "· 강사(화자)의 얼굴과 행동을 뚫어지게 응시함.  · 평소 거부 반응(울음)을 보이던 머리 감기 과정에서 웃으며 평온을 유지함."}, "135": {"i": "영유아검진(허벅지 주름 비대칭 발견), 뒤집기 시도 증가", "o": "· 허벅지 주름 비대칭으로 인한 고관절 탈구 가능성(정밀 검사 요망) 확인.  · 신체 회전(뒤집기) 모멘텀 지속적 증가."}, "136": {"i": "옆잠베개' 부재(환경 변수 누락), 미세한 소음 및 물리적 파동", "o": "· 익숙한 수면 보조 도구(옆잠베개) 부재 시 입면에 실패하고 심하게 보챔.  · 작은 소음이나 움직임에 깜짝 놀라는(모로 반사/예민함) 기질이 뚜렷함."}, "137": {"i": "스스로 뒤집기 시도, 부모의 개입(방해) 투입", "o": "· 신체 축을 비틀며 뒤집기 성공에 근접함.  · 실패해도 포기하지 않고 반복하며, 행동 제약 시 강한 짜증(분노)을 표출함."}, "138": {"i": "· 문화센터(원숭이 복장, 촉감놀이)  · 친구 집 방문 (연속된 외부 낯선 환경 노출)", "o": "수면 궤도 진입 실패, 잦은 야간 각성 및 심한 보챔(과자극에 의한 코르티솔 수치 상승)."}, "139": {"i": "· 엎드린 자세(터미타임) 제공  · 아빠와의 밀착 상호작용", "o": "· 뒤집기가 완성되지 않은 상태에서 엎드려 전진(배밀이)하려는 강한 추동을 보임.  · 아빠와 시선을 맞추며 소통함."}, "140": {"i": "· 주간 외출에 따른 과자극(Overstimulation) 발생  · 심야 시간 아빠의 물리적 스킨십(체온, 체취) 일시 투입", "o": "낮 동안의 시각/청각적 데이터 초과로 입면에 어려움을 겪었으나, 아빠의 품에 안긴 직후 급격히 안정을 찾고 즉각적인 수면 궤도에 진입함."}, "141": {"i": "친구들 집 초대 (다인원 상호작용)", "o": "낯선 사람 및 또래 아기들의 소리와 움직임에 노출됨."}, "142": {"i": "· 장난감(목표물) 제시 후 뒤집기 유도  · 수면 시 옆잠베개(물리적 제약) 투입", "o": "· 자력으로 뒤집기 최초 성공. 특히 시야에 목표물이 있을 때 회전 추동력이 강해짐.  · 옆잠베개를 불편해하며 심한 거부 반응을 보임."}, "143": {"i": "· 리조트 수영장 최초 입수(부력 및 수압 제공)  · 낯선 환경에서의 주간 활동 누적", "o": "· 수영 중 입에 거품을 물고 찡그리다 아빠 품에서 수면 궤도 진입.  · 저녁 시간 극심한 보챔과 짜증(과각성) 출력."}, "144": {"i": "1박 2일 여행 후 귀가, 장시간 차량 탑승(저주파 진동 및 백색소음 제공)", "o": "이동하는 차 안에서 한 번의 칭얼거림 없이 장시간 깊은 수면 상태를 유지함."}, "145": {"i": "· 문화센터 승무원 복장 및 촉감놀이  · 수유 및 수면 시도 (이앓이 통증 발현)", "o": "· 아랫잇몸에 하얀 유치가 관찰됨.  · 수유 중 심하게 보채고 울며, 옆잠베개를 강하게 거부함."}, "146": {"i": "· 목표물(장난감) 전방 배치  · 코어 근육 발달로 인한 착석 능력 향상", "o": "· 장난감을 쟁취하기 위해 배밀이로 전진함. 이동 중 체력이 고갈되면 바닥에 머리를 대고 쉬었다가 다시 전진하는 에너지 안배를 보임.  · 의자에 꼿꼿하게 앉아 노는 능력이 확보됨."}, "147": {"i": "부모의 스피너 회전 시범 (시각적/행동적 모델링 반복 노출)", "o": "부모의 행동을 관찰한 후, 거울 앞 스피너를 향해 손을 뻗어 정확한 타격으로 회전을 구현함."}, "148": {"i": "· 180도 신체 회전(뒤집기) 자율 수행  · 도서 및 목표물(풍선) 제공", "o": "· 짜증과 소리 지름 등 감정 표현의 해상도가 급격히 높아짐.  · 보조 없이 혼자서 완벽하게 뒤집기를 수행함.  · 누워서 스스로 책을 잡고, 엎드린 상태에서 풍선을 잡기 위해 배밀이로 낑낑대며 전진함."}, "149": {"i": "아빠의 오랜만의 조기 귀가 및 대면", "o": "아빠의 얼굴을 보자마자 환한 미소로 긍정적 정서를 표출함."}, "150": {"i": "· 기상 직후 폭발적인 옹알이 발화  · 작동 완구(까꿍 코끼리) 노출", "o": "· 다양한 톤과 성량으로 음성 데이터를 출력함.  · 코끼리 인형의 움직임과 소리에 집중하며 시각적 기대를 보임."}, "151": {"i": "· 엎드린 상태에서 전방 사물 탐색/파지 시도  · 부모 주도의 시각적 수 세기(손가락 덧셈) 지도", "o": "· 호기심(동기)을 바탕으로 목표를 향해 손을 뻗어 조작하려 함.  · 아빠가 손가락을 하나씩 펴며 수량이 증가하는 시각적 변화를 응시함."}, "152": {"i": "· 다수의 양육자(조부모, 삼촌)와의 대면 및 긍정적 정서 상태  · 손가락 수 세기 놀이(상수) 지속 투입", "o": "· 특정 대상을 향해 시선을 맞추며(눈맞춤) 다양한 데시벨과 톤으로 옹알이와 웃음을 발사함.  · 시각적 수량 변화에 대한 집중력 유지."}, "153": {"i": "하이체어(트립트랩) 착석 환경 제공 및 전방 스피너 조작 유도", "o": "코어 근육의 미숙함으로 상체가 앞으로 쏠리나, 넘어지지 않고 중심을 유지하며 두 손으로 스피너를 능숙하게 조작함. 웃음과 긍정적 정서 발현 빈도 증가."}, "154": {"i": "바닥 엎드림(터미타임) 상태에서 동적 목표물(꼬꼬맘) 노출", "o": "배를 축으로 삼고 양팔과 두 다리를 바닥에서 완전히 들어 올리는 '슈퍼맨 자세'를 유지하며 목표물을 응시함."}, "155": {"i": "· 공복 상태에서 시야 내 젖병 노출  · 엎드린 상태 전방에 그림책 배치", "o": "· 젖병 인지 즉시 울음의 데시벨 증폭  · 양손으로 책 모서리 파지 및 응시  · 야간 입면 거부 및 분유 섭취량 감소"}, "156": {"i": "야간 수면 루틴 시간에 맞춰 수면 방 진입 및 소등(조도 저하)", "o": "· 방 진입 시 칭얼거림 발생  · 소등 시 즉각 데시벨 최고조의 오열 출력"}, "157": {"i": "· 엎드린 자세(터미타임) 유지  · 점퍼루 탑승  · 영어 원서 동화책 청각 노출", "o": "· 엎드린 상태에서 누운 상태로 신체 축 180도 회전(되집기)  · 기구 내에서 다리로 바닥을 미는 물리적 반동 수행"}, "159": {"i": "문화센터 내 다수의 3차원 객체(볼풀 공, 계란 모형 등) 및 착석 환경 노출", "o": "타인의 주관적 평가(\"손을 잘 쓴다\") 접수 및 앉은 자세에서 양손으로 사물을 파지하고 조작함"}, "160": {"i": "수면 사이클 종료 후 자연 각성 (부모 부재 및 낮은 조도 유지)", "o": "각성 직후 즉각적인 울음(호출)을 출력하지 않고, 침대 위에서 수 분간 신체 조작 운동을 하며 대기함"}, "161": {"i": "투표소 방문 (낯선 다인원 공간 및 인공 조도 환경 노출)", "o": "특이적 저항(울음) 없이 고개를 유지하며 외부 환경을 응시함."}, "162": {"i": "· 이름 호명 음성 출력  · 부모 발음 노출  · 문화센터 내 또래 영아 노출", "o": "· 호명 방향으로 고개 회전  · '엄마/아빠' 유사 이음절 발화  · 또래를 향해 손을 뻗음"}, "163": {"i": "· 엎드린 자세에서 배밀이 유도  · 야간 수면 저항 및 분유량 저하 관찰", "o": "· 고개를 들고 전방을 보나 후방으로 몸이 밀림  · 야간 입면 거부 지속"}, "164": {"i": "실내 정원 카페 등 고조도/다인원 밀집 환경 노출", "o": "안구 수평 이동 및 주위 탐색, 지속적인 옹알이 발화 유지"}, "165": {"i": "양양자(부모)의 심리적 불안 상태 및 평소 대면 루틴 유지", "o": "부모의 밝은 표정 제시 시 미소 출력 및 신체 경직 없음"}, "166": {"i": "문화센터 니모 콘셉트 놀이 및 또래 영아 근접 배치", "o": "니모 의상 착용 상태로 주위 사물 및 타인에게 손 뻗음"}, "167": {"i": "가정 내 또래 친구 초대 및 매트 위 수평 대면 환경 제공", "o": "서로 마주 본 상태에서 시선을 고정(눈빛 교환)하고 옹알이 교환"}, "168": {"i": "· 저상형 침대와 벽면 사이 틈새(물리적 제약) 발생  · 약 30분간 고립 및 강성 울음 발생  · 분유 수유 수행", "o": "· 새벽 2시경 틈새 낙하 후 탈출 불가  · 울음과 지침의 주기적 반복 후 수면  · 구조 후 분유 정상 섭취"}, "169": {"i": "· 젖병 내 빨대 부속 추가 및 분유 급여  · 또래 영아 모임 노출", "o": "· 빨대 흡철을 통해 분유 정상 소화  · 야간 수면 진입 저항 및 보챔 증가"}, "170": {"i": "· 수면 모니터링 카메라 추가 설치  · 침대 프레임 재배치 및 문 가드 결합", "o": "수면실 하드웨어 경계조건(Boundary Condition) 틈새 제로(0)화 완결"}, "171": {"i": "부부동반 모임 내 타인(양육자 집단)의 음성 및 정서 자극 노출", "o": "타인으로부터 \"말이 많고 언어 발달이 빠르다\"는 주관적 평가 데이터 수집"}, "172": {"i": "처갓집 방문을 통한 가족(친숙) 및 타인(비친숙) 대면 시각 자극 제공", "o": "타인 대면 시 미소 생략, 가족 구성원 대면 시 안면 미소 알고리즘 즉각 출력"}, "173": {"i": "· 저온 공기(에어컨 바람) 접촉  · 고형식(이유식, 떡뻥) 급여  · 소아과 처방약 투약", "o": "· 비강 분비물(콧물) 및 기침 발현  · 떡뻥 과자를 손으로 쥐고 구강 흡철 조작  · 투약 후 수면 잠복기 추적"}, "174": {"i": "상기도 감염(감기) 증상 유지 및 지속적인 체온 상태 모니터링", "o": "콧물 분비 및 인두 자극에 의한 기침 지속됨. 고열(38.0°C 이상)은 계측되지 않음."}, "175": {"i": "양육자 간(부부)의 언어적 발화 빈도 감소 및 가정 내 냉전 환경 조성", "o": "양육자들의 안면을 번갈아 응시하며, 특이적인 자발적 울음이나 정서 위축 반응은 없음."}, "176": {"i": "아내 친구들(비친숙 성인 객체 다수)과의 근접 대면 자극 노출", "o": "초면의 인물들이 접근할 때 회피 행동(울음) 없이 상대방 안면 좌표를 지속 응시함."}, "177": {"i": "이름 호명 자극 투입 및 손 도달 범위 내 다양한 사물 배치", "o": "호명 주파수 입력 시 두부 회전축 이동. 사물을 향해 손을 뻗어 파지하는 빈도 증가."}, "178": {"i": "청경채 미음 급여, 양육자의 구강 개폐 시각 자극 및 \"아, 냠냠\" 음조 출력", "o": "스푼 근접 시 하악을 하강하여 구강 개방, 양육자 조음 시 입술 저작 운동 동기화."}, "179": {"i": "반경 30cm 이내에 다양한 무생물 객체(완구류 등) 배치", "o": "사물을 향해 상지를 뻗어 손가락 말단으로 쥐고 만지는 행동 빈도 증가"}, "180": {"i": "양육자 안면 좌표를 영아 상지 반경(30cm) 내 접근", "o": "양손 대칭 확장 후 양볼 안착, 지골 미세 구동 없는 압력 유지"}, "181": {"i": "야간 REM 수면 진입기 앙와위 배치", "o": "수면 중 자발적 뒤집기 후 슈퍼맨 자세 연쇄 구동 및 오열, 사지 진동"}, "182": {"i": "· 하이체어 착석 후 윈켈 치발기 제공  · 전방 40cm 거리에 꼬꼬맘 가동  · 비친숙 성인(처남)의 아는 척", "o": "· 치발기 좌우 교대 파지 후 구강 이동  · 꼬꼬맘 접근 시 상지 확장 포획  · 처남 대면 시 구각 하강 및 신체 회전"}, "183": {"i": "· 주간 비통제 야외 산책 자극 제공  · 야간 수면 유도 루틴 가동", "o": "· 주위 피사체로 안구 회전 및 주시 지속  · 입면 잠복기 연장 및 야간 각성 빈도 증가"}, "184": {"i": "문화센터 미역 촉감 놀이 매체 노출 및 수평 공간 배치", "o": "미역 질량체 표면에 소근육 확장 및 쥐기 운동 반복, 주변 탐색"}, "185": {"i": "· 수면 전 오열 상태서 정면 양육자 안면 노출  · 공복/졸림(생리적 결핍) 상태 진입", "o": "· 양손 대칭 확장 후 양볼 고정성 파지  · 결핍 시 분당 옹알이 발화 횟수 급증"}, "186": {"i": "· 오열 상태서 호흡 주기 변환  · 영어 팝업북 노출 및 음성 낭독 제공", "o": "· 'ㅇ', 'ㅁ' 음소 결합(\"엄마\") 주파수 출력  · 팝업북 입체 도상 안구 고정"}, "187": {"i": "문화센터 내 수박 촉감 놀이 매체(고명도/구형 완구) 노출 및 수평 공간 배치 (1000038431.jpg 외)", "o": "· 사물의 체적에 맞춰 손가락 벌림 반경 비례 조절 후 파지  · 야간 수면 중 1~2시간 주기로 수시 각성 후 보챔 출력"}, "188": {"i": "· 초기 이유식 수유 중 숟가락 끝 신체 접촉 (1000038483.jpg)  · 파지 완구 및 도서 이송 차단 자극  · 3차 정기 예방접종 의학 변수 투입", "o": "· 숟가락 말단을 쥐고 구강 영역으로 이송 조작  · 소유물 격리 시 고주파 발성(짜증) 출력  · 보드북 지면을 소근육으로 파지 후 회전(넘기기) (1000038483.jpg 비디오)"}, "189": {"i": "입면 시간대 침실 소등 및 수면 유도 루틴 가동", "o": "하품 반사(생리적 피로) 출력과 동시에 사지 운동량 증가 및 입면 거부 반응 유지"}, "190": {"i": "· 원거리(방 경계 밖) 대면 자극 제시  · 젖병 쉐이커 구동 소음 및 청각 자극 투입  · 조제 완료된 젖병 시각 노출", "o": "· 원거리 화자의 안면을 향해 시선 고정 및 미소 출력  · 쉐이커 소음 인지 후 신체 버둥거림 및 고주파 발성 유발"}, "191": {"i": "문화센터 강냉이 촉감 놀이 매체 노출 및 수평 공간 배치", "o": "하체 지지 후 둔부 안착 상태 유지, 양손 말단 근육 구동을 통한 고형물 파지 및 마찰 탐색"}, "192": {"i": "고형 유체 매체(첫 요거트) 구강 진입 자극 (1000038710.jpg)", "o": "초기 미세 각성 및 보챔(울음) 출력 후 근육 이완 및 섭식 인입 적응"}, "193": {"i": "기하학적 목재 적목 블록 다수 배치 및 양육자의 분류 시연 (1000038432.mp4 참조)", "o": "블록 객체를 움켜쥐고 전방 수평 벡터로 투척(던지기 행동) 연쇄 수행"}, "194": {"i": "일상 각성 상태에서의 청각 음성 주파수 노출 및 수유 루틴 가동", "o": "양육자 대면 시 단음절 및 복합 조음 발화 빈도 상승, '아', '바' 음소 결합 감지"}, "195": {"i": "· 야간 수면 중 임의 각성 조건 노출  · 목욕 및 일과 중 신체 짚기 기반 수 세기 놀이 자극", "o": "· 자발적 뒤집기 기동 후 앙와위 복귀 실패로 보챔 출력  · 수 세기 놀이 시 아빠의 손가락 말단에 안구 고정"}, "196": {"i": "가정 내 동종 생물학적 객체(반려견 레오) 근접 대면 및 신체 단서 노출 (1000038870.jpg)", "o": "상지를 전방으로 확장하여 반려견의 하지 및 미부 피모를 소근육 파지(쥐기 및 문지르기)함"}, "197": {"i": "인스파이어리조트 대형 미디어 월(LED 디스플레이) 고명도·동적 시각 자극 노출 (1000038911.jpg 비디오)", "o": "유모차에 각성 상태로 탑승하여 디스플레이 움직임 벡터를 향해 안구를 상측으로 고정하고 장시간 주시함"}, "198": {"i": "· 문화센터 집단 환경 내 다감각 매체 노출 및 일본 문화 의상 착용 (1000038911.jpg)  · 주간 정기 초기 이유식 급여", "o": "· 매체 접촉 조작 수행  · 스푼 유입 시 능동적으로 구강을 개방하고 삼킴 유효율 상승"}, "199": {"i": "· 수평 지면에 설치된 다축 수직 원목 교구(교구 기둥) 노출  · 일상 각성기 상태의 조음 자극 입력 유도", "o": "· 교구 프레임의 전도(쓰러짐) 없이 수직 축에서 블록을 상측으로 분리 인입함  · 설단을 전방으로 돌출(메롱 행동)하며 다중 주파수 고주파 발성 수행"}, "200": {"i": "인구 밀도가 높고 복잡한 대형 매장(이케아) 방문 및 쇼룸 내 고대비 점무늬 침구 노출", "o": "주변 피사체를 두리번거리며 집중함. 도트 무늬 침구 위에서 미소를 보였으나, 야간에 입면을 힘들어함."}, "201": {"i": "주간 낮잠 지속 시간의 단축 경향 포착", "o": "낮 각성 시간의 상대적 증가"}, "202": {"i": "야간 입면 시 조도 소등 및 수면 루틴 가동", "o": "진입 전 고볼륨의 울음 및 저항 행동 표출"}, "203": {"i": "가정 내 정면 대면 상황에서의 안구 정렬 관찰", "o": "미세한 안구 내측 편위 가능성 제기 (가성내사시 여부 검증 필요)"}, "204": {"i": "한국어·영어 도서 낭독 및 음성 펜(세이톡) 청각 자극, 공기 주입식 아기의자 배치", "o": "펜 소리에 안구 고정 및 집중, 누운 자세에서 발로 의자를 밀어내며 신체 변위 유발"}, "205": {"i": "· 거울에 부착된 회전 스피너 노출  · 3차원 원목 교구 제시  · 그림책 독서 중 \"무당벌레야\" 언어 자극", "o": "· 스피너가 완전히 멈출 때까지 대기 후 재회전 시킴  · 네모, 세모 등 2차원 단어 청취하며 탐색  · 고개를 숙여 특정 도상을 집중 응시"}, "206": {"i": "· 독서 제안 시 과장된 표정과 효과음 제시  · 놀이 매트 위 독립적인 자유 놀이 환경 제공", "o": "· 제안 자극에 웃음으로 화답하며 독서 진입  · 한 가지 조각에 집착하지 않고 다양한 조각을 교차 탐색"}, "207": {"i": "· 주머니와 통을 활용한 '안과 밖 놀이' 시연  · 오전 영어 평면도형 책 독서 및 오후 원목 교구 연계 복습  · 베이비룸 울타리 틈새 너머 원거리 사물 배치", "o": "· 통 안의 물건을 밖으로 빼내는 과정 주시 및 그림책 타공 응시  · 네모, 동그라미 어휘에 맞춰 사물 탐색  · 울타리 창살 사이로 손을 뻗어 외부 영역의 노란 고리 조준 파지 성공"}, "208": {"i": "놀이판 마스킹 테이프, 엄마 치마 꽃무늬 패턴", "o": "테이프를 한참 응시 후 손가락 끝으로 뜯어내고, 치마 꽃무늬를 잡으려 손을 뻗음"}, "209": {"i": "거실 놀이 매트 위 탁 트인 수평 공간", "o": "팔다리를 교대로 움직여 앞으로 기어가고, 무릎과 발바닥으로 지면을 지지하며 상체를 세우려 함"}, "210": {"i": "놀이 매트 정면에 분산 배치된 장난감 및 수평 공간", "o": "손바닥과 무릎을 바닥에 대고 엉덩이를 띄우는 네발기기 자세를 취하며 전진 시도"}, "211": {"i": "물과 물고기 모형이 들어 있는 투명 워터매트", "o": "물고기를 잡기 위해 돌진하여 워터매트 투명 표면에 얼굴과 입을 밀착함"}, "212": {"i": "회전 스피너, 오뚝이 완구 노출", "o": "완구가 완전히 멈출 때까지 기다린 후, 정지 상태를 확인하고 다시 손을 뻗어 조작함"}, "213": {"i": "유치 돌출(이앓이) 반응 및 치발기/장난감 노출", "o": "장난감을 입에 넣고 계속 씹으며, 야간 수면 중 자주 깨어나 보챔"}, "214": {"i": "거실 놀이 매트 위 탁 트인 수평 공간", "o": "배밀이 상태에서 두 발을 가슴 하단으로 모으며 복부와 엉덩이를 띄우는 네발기기 준비 자세를 취함"}, "215": {"i": "내용물이 들어 있는 무거운 유리 젖병", "o": "젖병을 들고 마시던 중 기울어져 분유가 잘 나오지 않자, 젖병 밑부분을 직접 위로 들어 올려 각도를 세움"}, "216": {"i": "아기띠를 통한 수직 이동, 네발기기 중 신체 중심 변화", "o": "바닥에 눕히면 울다가 아기띠 수직 이동에 진정됨. 음 빠 소리를 냄. 네발기기 중 다리가 당겨져 우연히 혼자 앉기 1회 발현"}, "217": {"i": "평면 그림책, 원목 교구 틀 및 블록 조각들", "o": "책 앞으로 기어가 그림과 글자를 정면 응시함. 원하는 블록을 빼기 위해 교구 틀 자체를 수평으로 넘어뜨린 뒤 내부 블록을 분리함"}, "218": {"i": "통 속에 장난감을 넣고 빼는 놀이, 수 세기(1~20, 목욕 시 1~5) 청각 자극", "o": "아빠가 통에 물건을 넣고 빼며 정속 리듬으로 들려주는 수 세기 음성에 시선을 맞추고 응시함"}, "219": {"i": "집드리 모임(또래 아기들 및 부모 초청), 전화기 장난감 배치", "o": "낯선 인원과 소음 환경에서 평소와 달리 잠투정을 표출함. 친구와 전화기 장난감을 잡고 서로 끌어당김"}, "220": {"i": "베이비룸 안전 울타리 가드 및 문 앞 공간", "o": "울타리 문 앞에 서서 바깥을 응시하거나 소리를 지르며 가드 너머로 나가려는 행동을 보임"}, "221": {"i": "잼잼 시연, 반짝반짝 작은별 노래 및 율동, 러닝테이블 완구 노출", "o": "잼잼과 손 흔들기 모방 시도. 완구 조작 시 손 전체가 아닌 손가락 말단(손가락 끝)을 사용하는 소근육 분화 조작 수행"}, "222": {"i": "벽면 차트에 붙인 마스킹 테이프, 1:1 수 세기 육성 자극", "o": "마스킹 테이프를 시각 스캐닝 후 손가락 말단 손톱/지문 면으로 잡고 간헐적으로 뜯어내려 시도함. 수 세기 자극에는 손을 뻗어 표면을 두드리는 반응 표출"}, "223": {"i": "거실 안전 울타리 안 전면 거울 가드, 회전 스피너 완구 노출", "o": "스스로 하체와 둔부를 바닥에 고정해 앉은 자세를 유지하며 스피너를 손으로 쳐서 돌린 뒤, 회전 중인 날개를 손바닥으로 눌러 정지시킴"}, "224": {"i": "광명동굴 계단 및 외부 기온 변화(동굴 내부 한기 vs 외부 열기)", "o": "계단을 오르내릴 때 안구 초점을 고정하며 신체 기울기 변화에 반응하고, 기온 편차에 어깨를 작게 움츠림"}, "225": {"i": "거실 매트 위 공 굴리기 놀이, 언어 자극(\"굴러간다\", \"멈췄다\")", "o": "공이 굴러가는 궤적과 손에 닿는 순간을 눈으로 추적함. 스스로 공을 밀어 굴리는 자발적 투척은 아직 관찰되지 않음"}, "226": {"i": "매트 위 소형 원색 공 노출, \"공 굴려봐\" 언어 자극", "o": "공을 밀어 굴리기보다 둥근 표면을 조심스럽게 감싸 잡아 몸쪽으로 끌어당김"}, "227": {"i": "작은 용기(초록 통) 및 큰 통(원통), 소형 원색 공(4개), 수 세기(\"하나, 둘, 셋, 넷, 다섯\") 및 위치 어휘(\"안, 밖\")", "o": "공을 손가락 말단으로 쥐는 것은 원활하나, 큰 통 입구로 정확히 조준하여 떨어뜨리는 위치 정밀 조작에는 다소 미숙함. 공의 이송과 아빠의 수 세기 리듬에 반응해 손을 뻗음"}, "228": {"i": "2박 3일 단체 여행, 낯선 타인 및 또래 영아(네발기기 구동) 노출, 마찰력 부족한 매트리스 환경", "o": "또래 아기들의 네발기기 동작을 관찰한 후, 기존 배밀이 자세에서 무릎과 발바닥을 지면에 대고 모방 시도"}, "229": {"i": "시각 그림 플래시카드, 빠른 카드 제시 자극, 주변 성인들의 평가 소음", "o": "플래시카드가 전환되는 동안 시선을 카드 중앙에 고정하고 정면 주시 상태 지속"}, "23 function zLMS(L,M,S,x){ return L===0 ? Math.log(x/M)/S : (Math.pow(x/M,L)-1)/(L*S); }
function pctFromZ(z){
  if(z<-6)return 0.1; if(z>6)return 99.9;
  const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p = z>0 ? 1-p : p;
  return Math.max(0.1,Math.min(99.9,p*100));
}
function lmsAt(key,m){
  const tb=WHO_LMS[key]; if(!tb)return null;
  const mm=Math.max(0,Math.min(24,m));
  const lo=Math.floor(mm), hi=Math.min(24,lo+1), f=mm-lo;
  const a=tb[lo], b=tb[hi]||tb[lo];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function valueAtZ(key,m,z){
  const p=lmsAt(key,m); if(!p)return null;
  const [L,M,S]=p;
  return L===0 ? M*Math.exp(S*z) : M*Math.pow(1+L*S*z, 1/L);
}

/* ============ 놀이 추천 (v1 로직 유지) ============ */
function suggestToday(){
  const t=todayStr(); if(sugCache[t])return sugCache[t];
  const m=Math.min(monthAge(),7);
  let pool=PLAYS.filter(p=>p.m===m||p.m===Math.max(0,m-1));
  if(!pool.length)pool=PLAYS.filter(p=>p.m>=6);
  const recent=new Set();
  Object.keys(sugCache).forEach(d=>{if(daysBetween(d,t)<=2&&daysBetween(d,t)>=0)sugCache[d].forEach(n=>recent.add(n))});
  playLogs.forEach(l=>{if(daysBetween(l.date,t)<=2)recent.add(l.n)});
  let avail=pool.filter(p=>!recent.has(p.n)); if(avail.length<2)avail=pool;
  const seed=hash(t+(child?child.birth:""));
  const pick=(arr,off)=>arr.length?arr[(seed+off)%arr.length]:null;
  const chosen=child&&child.domain&&child.domain!=="none"?child.domain:null;
  let s1=null;
  if(chosen){let cs=avail.filter(p=>p.dom===chosen); if(!cs.length)cs=avail.filter(p=>p.dom2===chosen); s1=pick(cs,0)||pick(avail,0)}
  else s1=pick(avail,0);
  const others=avail.filter(p=>p.n!==(s1&&s1.n)&&(!s1||p.dom!==s1.dom));
  const s2=pick(others,3)||pick(avail.filter(p=>p.n!==(s1&&s1.n)),3);
  const res=[s1,s2].filter(Boolean).map(p=>p.n);
  sugCache[t]=res;save();return res;
}

  return STAGES.find(s=>m>=s.range[0]&&m<s.range[1])||STAGES[STAGES.length-1];
}
function watchDay(){ if(!feed.watch)return 0; return daysBetween(feed.watch.start,todayStr())+1 }
function triedOK(){ return Object.keys(feed.tried).filter(n=>feed.tried[n].r!=="warn") }
function stageMeals(stage){ return stage.k==="early"?2:stage.k==="mid"?2:stage.k==="late"?3:stage.k==="done"?3:0 }
function mealsOf(stage){ return feed.mealsPerDay || stageMeals(stage) }
const STAGE_ORDER={early:1,mid:2,late:3,done:4};
function addDays(ds,n){ const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
/* 한 달(28일) 월력표 생성 — 토핑이유식.
   3일 블록 = 「큐브 재고 세트」(한 번 만들어 소분하는 단위). 재고는 3일간 같지만,
   **끼니마다 재고에서 다른 조합**을 꺼내 쓴다 (베이스·단백질·채소 로테이션).
   새 재료는 블록당 1개 — 매일 첫 끼(오전)에 소량 포함해 3일 연속 관찰. 다음 새 재료까지 3일 간격(CDC·AAP 3~5일 하한). */
function buildMonth(fromDs, delayFirstTest){
  const stage=curStage(); if(stage.k==="pre") return;
  const n=mealsOf(stage);
  const AF=allFoods(), okSet=new Set(triedOK());
  const pool=c=>AF.filter(f=>f.cat===c&&okSet.has(f.n)).map(f=>f.n);
  const bases=pool("base"), prots=pool("protein"), vegs=pool("veg"), extras=pool("fruit").concat(pool("dairy"));
  const cand=AF.filter(f=>(STAGE_ORDER[f.s]||9)<=(STAGE_ORDER[stage.k]||0)
    && !feed.tried[f.n] && !(feed.watch&&feed.watch.name===f.n)).map(f=>f.n);
  let ci=0;
  let blockDelay = delayFirstTest?1:0;
  if(feed.testPause) ci=cand.length;
  else if(feed.watch) blockDelay=Math.max(blockDelay,1);
  const seed=hash(fromDs+(child?child.birth:""));
  const take=(arr,start,k)=>{ const out=[]; for(let t=0;t<arr.length&&out.length<k;t++){const v=arr[(start+t)%arr.length]; if(!out.includes(v))out.push(v);} return out; };
  /* 생선은 주 2회 안팎으로 제한 (식약처 생선 안전섭취 가이드·FDA 어린이 권고를 보수적으로 적용) */
  const fishSet=new Set(AF.filter(f=>f.fish).map(f=>f.n));
  const fishByDay=new Array(28).fill(0);
  const fishWeek=(di)=>{ let s=0; for(let k=Math.max(0,di-6);k<=di;k++) s+=fishByDay[k]; return s; };
  const bowl = feed.style==="bowl";
  for(let b=0; b*3<28; b++){
    const test = (b>=blockDelay && ci<cand.length) ? cand[ci++] : null;
    /* 이 블록의 재고: 베이스 최대 2 · 단백질 최대 2 · 채소 최대 4 (토핑=큐브 / 죽=끓일 죽의 재료) */
    const stockB=take(bases,seed+b,2), stockP=take(prots,seed+b,2), stockV=take(vegs,(seed+b*3)%97,4);
    /* 죽이유식: 블록마다 죽 1~2가지를 배치로 끓여 나눠 먹는다 (끼니마다 새 죽 X — 현실 조리 단위) */
    let recipes=[];
    if(bowl){
      /* 이번 주 생선 여유가 없으면 죽 재료 선정 단계에서부터 생선을 빼고 짠다
         (안 그러면 생선죽이 통째로 막혀 남은 죽 하나만 6끼 반복되는 문제) */
      const fishBlocked = fishWeek(b*3)>=2;
      const pickP=(pref)=>{ if(!pref)return null;
        if(fishSet.has(pref)&&fishBlocked) return stockP.find(x=>!fishSet.has(x))||null;
        return pref; };
      const p1=pickP(stockP[0]), p2raw=pickP(stockP[1]||stockP[0]);
      const p2=(p2raw===p1 && stockP.find(x=>x!==p1&&(!fishSet.has(x)||!fishBlocked)))||p2raw;
      const b2=stockB[1]||stockB[0];
      const rA=[].concat(stockB[0]?[stockB[0]]:[], p1?[p1]:[], stockV.slice(0,2));
      const rB=[].concat(b2?[b2]:[], p2?[p2]:[], stockV.length>2?stockV.slice(2,4):stockV.slice(0,2));
      recipes=[rA];
      if(rB.length && JSON.stringify(rB)!==JSON.stringify(rA)) recipes.push(rB);
      if(!rA.length){ recipes = extras.length? [[extras[b%extras.length]]] : [[]]; }
    }
    for(let d=0; d<3 && b*3+d<28; d++){
      const di=b*3+d, ds=addDays(fromDs,di);
      const meals=[];
      for(let m=0;m<n;m++){
        let items=[];
        if(bowl){
          /* 테스트 기간엔 첫 끼=죽1 고정(아침 관찰), 평소엔 날짜별로 죽 순서를 바꿔 단조로움 줄이기 */
          let r=recipes[(test? m : d+m)%recipes.length]||[];
          if(r.some(x=>fishSet.has(x)) && fishWeek(di)>=2){
            const alt=recipes.find(rr=>rr.length&&!rr.some(x=>fishSet.has(x)));
            r = alt || r.filter(x=>!fishSet.has(x));
          }
          items=r.slice();
          if(test && m===0 && !items.includes(test)) items.push(test); /* 새 재료는 죽에 섞기 전 따로 맛보기 */
        } else {
          const idx=d*n+m+d;  /* +d: 날짜별 오프셋 — 다음 날 같은 끼니도 조합이 밀리게 */
          if(stockB.length) items.push(stockB[idx%stockB.length]);
          if(stockP.length){
            let pn=stockP[idx%stockP.length];
            if(fishSet.has(pn) && fishWeek(di)>=2){ const alt=stockP.find(x=>!fishSet.has(x)); pn=alt||null; }
            if(pn) items.push(pn);
          }
          for(let v=0;v<2&&stockV.length;v++){ const f=stockV[(idx*2+v)%stockV.length]; if(!items.includes(f)) items.push(f); }
          if(!items.length && !test && extras.length) items.push(extras[idx%extras.length]);
          if(test && m===0 && !items.includes(test)) items.push(test);  /* 새 재료는 매일 첫 끼에만 */
        }
        if(items.some(x=>fishSet.has(x))) fishByDay[di]++;
        meals.push({items});
      }
      feed.plan[ds]={meals,test:(test&&d===0)?test:null,block:b,testItem:test||null,
        stock:{b:stockB,p:stockP,v:stockV}};
    }
  }
  feed.planMade=todayStr(); save();
}function hasPlanAhead(){ let c=0; for(let d=0;d<7;d++){ if(feed.plan[addDays(todayStr(),d)]) c++; } return c>=4; }
function weekShopping(){
  const set=new Set();
  for(let d=0;d<7;d++){ const p=feed.plan[addDays(todayStr(),d)]; if(!p)continue;
    if(p.test)set.add(p.test); (p.meals||[]).forEach(m=>(m.items||[]).forEach(i=>set.add(i))); }
  return [...set];
}

function addCustomFood(){
  const n=prompt("재료 이름 (예: 브로콜리)"); if(!n||!n.trim())return;

  const c=prompt("종류를 골라주세요:\n1 베이스(곡물)  2 단백질  3 채소  4 과일  5 유제품","3");
  const cat=({1:"base",2:"protein",3:"veg",4:"fruit",5:"dairy"})[(c||"3").trim()]||"veg";
  feed.custom=feed.custom||[]; feed.custom.push({n:nm,cat,s:"mid"});
  feed.tried[nm]={d:"이전",r:"ok"};   /* 직접 추가 = 이미 먹여본 재료라는 뜻 */

function logItem(l){
  return '<div class="card" style="padding:12px 14px"><div class="logitem" style="margin:0">'
  +'<div class="dt">'+l.date+(l.doms&&l.doms.length?' · '+l.doms.map(d=>DOM_ICON[d]).join(""):"")+'</div>'

function logSave(){
  const i=$("#lgIn").value.trim(),o=$("#lgOut").value.trim(),nt=$("#lgNote").value.trim();
  if(!i&&!o&&!nt){alert("한 칸이라도 적어주세요.");return}
  const doms=[...document.querySelectorAll("#lgDoms .condbtn.on")].map(b=>b.dataset.d);
  logs.push({date:todayStr(),input:i,output:o,note:nt,doms});save();render();
}
function copyTSV(date){
  const rows=logs.filter(l=>l.date===date).map(l=>
    [l.date,"D"+dayNum(l.date),(l.doms||[]).join("/"),l.input,l.output,l.note].map(x=>(x||"").replace(/\t/g," ").replace(/\n/g," ")).join("\t")).join("\n");
  const done=()=>alert("복사했어요. 구글 시트에 붙여넣으세요.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(rows).then(done,()=>fallbackCopy(rows,done));
  else fallbackCopy(rows,done);
}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
 ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);cb()}

/* ============ 달력 ============ */
function vCalInner(){
  if(!calMonth){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()}}
  const{y,m}=calMonth;
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const logDates=new Set(logs.map(l=>l.date).concat(playLogs.map(l=>l.date)));
  let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
  +'<button class="ghost" onclick="calShift(-1)">◀</button><b class="hd" style="font-size:16px">'+y+'년 '+(m+1)+'월</b><button class="ghost" onclick="calShift(1)">▶</button></div><div class="cal">';
  ["일","월","화","수","목","금","토"].forEach(d=>h+='<div class="h">'+d+'</div>');
  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cls=["d"];if(logDates.has(ds))cls.push("dot");if(ds===todayStr())cls.push("today");if(ds===calSel)cls.push("sel");
    h+='<div class="'+cls.join(" ")+'" onclick="calSel=\''+ds+'\';render()">'+d+'</div>'}
  h+='</div><div class="small" style="margin-top:8px">● 기록 있음 — 빈 날엔 아무 표시도 안 해요. 「놓친 날」 같은 건 없어요.</div></div>';
  h+='<div class="card"><label class="f" style="margin-top:0">🔍 기록 검색</label><input type="text" id="q" placeholder="예: 뒤집기" oninput="renderSearch(this.value)"><div id="qRes"></div></div>';
  if(calSel){
    const dl=logs.filter(l=>l.date===calSel),pl=playLogs.filter(l=>l.date===calSel);
    h+='<h3>'+calSel+'</h3>';
    if(!dl.length&&!pl.length)h+='<div class="sub">기록이 없어요.</div>';
    dl.forEach(l=>h+=logItem(l));
    pl.forEach(l=>{const p=PLAYS.find(x=>x.n===l.n);
      h+='<div class="card" style="padding:11px 14px;font-size:14px">'+({happy:"😀",meh:"😐",sad:"🙁",skip:"⏭"})[l.res]+' <b>'+esc(p?p.name:l.n)+'</b>'
      +(l.cond?' <span class="chip">'+CONDS.find(c=>c[0]===l.cond)[1]+'</span>':"")+'</div>'});
    if(dl.length)h+='<button class="sec" onclick="copyTSV(\''+calSel+'\')">📋 이 날짜 시트용 복사</button>';
  }
  return h;
}
function calShift(d){calMonth.m+=d;if(calMonth.m<0){calMonth.m=11;calMonth.y--}if(calMonth.m>11){calMonth.m=0;calMonth.y++}calSel=null;render()}
function renderSearch(q){
  const box=$("#qRes");if(!q){box.innerHTML="";return}
  const hits=logs.filter(l=>(l.input+" "+l.output+" "+(l.note||"")).includes(q)).slice(-8).reverse();
  box.innerHTML=hits.length?hits.map(l=>'<div class="logitem"><div class="dt">'+l.date+'</div><div style="font-size:13.5px">'+esc((l.input+" / "+l.output).slice(0,80))+'…</div></div>').join("")
   :'<div class="small" style="margin-top:8px">검색 결과가 없어요.</div>';
}

/* ============ 수면 ============
   기록 모델: {d:"YYYY-MM-DD"(시작일), s:"HH:MM", e:"HH:MM", n:1(낮잠)|0(밤잠)}

function hm2m(t){ const [a,b]=(t||"0:0").split(":").map(Number); return (a||0)*60+(b||0); }
function m2hm(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function durMin(x){ let d=hm2m(x.e)-hm2m(x.s); if(d<0)d+=1440; return d; }
function fmtDur(m){ const h=Math.floor(m/60), r=m%60; return (h?h+"시간":"")+(r?(h?" ":"")+r+"분":(h?"":"0분")); }
function sleepsOn(ds){ return sleeps.filter(x=>x.d===ds); }
/* 그날의 총 수면: 그날 시작한 잠 + 전날 밤잠이 넘어온 분량 */
function sleepTotal(ds){
  let t=0;
  sleepsOn(ds).forEach(x=>{ t+=durMin(x); });
  const prev=sleeps.filter(x=>x.d===addDays(ds,-1) && !x.n && hm2m(x.e)<hm2m(x.s));
  return t;
}
function napCount(ds){ return sleepsOn(ds).filter(x=>x.n).length; }
function sleepRange(arr,m){ for(const r of arr){ if(m>=r[0]&&m<r[1])return r; } return null; }
function wakeWindows(ds){
  const day=sleepsOn(ds).slice().sort((a,b)=>hm2m(a.s)-hm2m(b.s));
  const out=[];
  for(let i=0;i<day.length-1;i++){
    let gap=hm2m(day[i+1].s)-hm2m(day[i].e); if(gap<0)gap+=1440;
    if(gap>0&&gap<720) out.push(gap);
  }
  return out;
}

function tParse(v){ v=(v||"").trim().replace(/[.시]/g,":").replace(/분/g,"");

/* ============ 📈 WHO 성장 백분위 ============ */
function growthPct(g,gk){
  if(!child||!child.sex)return null;
  const def=GKEYS.find(x=>x.k===gk); if(!def)return null;
  const v=parseFloat(g[def.f]); if(!v||v<=0)return null;
  const m=monthsBetween(child.birth,g.date);
  if(m<0||m>24)return null;
  const p=lmsAt(def.lms(child.sex),m); if(!p)return null;
  return {m, v, z:zLMS(p[0],p[1],p[2],v), pct:pctFromZ(zLMS(p[0],p[1],p[2],v))};
}
function monthsBetween(b,d){ return daysBetween(b,d)/30.4375; }
function growthChart(gk){
  const def=GKEYS.find(x=>x.k===gk); if(!def||!child||!child.sex)return "";
  const key=def.lms(child.sex);
  const W=320,H=200,PL=34,PR=8,PT=10,PB=22;
  const maxM=Math.max(6,Math.min(24,Math.ceil(monthAge()+2)));
  const zs=[-2,-1,0,1,2];
  let vmin=1e9,vmax=-1e9;
  const curves=zs.map(z=>{
    const pts=[];
    for(let m=0;m<=maxM;m+=0.5){ const v=valueAtZ(key,m,z); if(v==null)continue; pts.push([m,v]); vmin=Math.min(vmin,v); vmax=Math.max(vmax,v); }
    return {z,pts};
  });
  const mine=growth.map(g=>{const r=growthPct(g,gk); return r?[r.m,r.v,g.date,r.pct]:null}).filter(Boolean).filter(p=>p[0]<=maxM);
  mine.forEach(p=>{vmin=Math.min(vmin,p[1]);vmax=Math.max(vmax,p[1])});
  const pad=(vmax-vmin)*0.08||1; vmin-=pad; vmax+=pad;
  const X=m=>PL+(m/maxM)*(W-PL-PR), Y=v=>PT+(1-(v-vmin)/(vmax-vmin))*(H-PT-PB);
  const path=pts=>pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  let sv='<svg class="gchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+def.nm+' 성장 곡선">';
  /* 3~97 백분위 밴드 */
  const band=(a,b2,op)=>{
    const A=curves.find(c=>c.z===a).pts, B=curves.find(c=>c.z===b2).pts.slice().reverse();
    return '<path d="'+path(A)+" "+B.map(p=>"L"+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")+' Z" fill="var(--mint)" opacity="'+op+'"/>';
  };
  sv+=band(-2,2,.28)+band(-1,1,.34);
  curves.forEach(c=>{
    sv+='<path d="'+path(c.pts)+'" fill="none" stroke="var(--sub)" stroke-width="'+(c.z===0?1.6:0.8)+'" opacity="'+(c.z===0?.75:.4)+'"'+(c.z===0?"":' stroke-dasharray="3 3"')+'/>';
  });
  /* 축 */
  for(let m=0;m<=maxM;m+=(maxM>12?6:3)) sv+='<text x="'+X(m)+'" y="'+(H-6)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+m+'개월</text>';
  [vmin+(vmax-vmin)*0.1, (vmin+vmax)/2, vmax-(vmax-vmin)*0.1].forEach(v=>{
    sv+='<text x="4" y="'+(Y(v)+3)+'" font-size="9" fill="var(--sub)">'+v.toFixed(v>20?0:1)+'</text>';
  });
  /* 우리 아이 */
  if(mine.length>1) sv+='<path d="'+path(mine)+'" fill="none" stroke="var(--coral)" stroke-width="2.4" stroke-linecap="round"/>';
  mine.forEach(p=>{ sv+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="var(--coral)"/>'; });
  sv+='</svg>';
  return sv;
}

function backupDue(){
  const first=store.get("firstUse"), last=store.get("lastBackup");
  if(!first){ store.set("firstUse",todayStr()); return false; }
  const total=logs.length+playLogs.length+Object.keys(feed.plan||{}).length+sleeps.length+growth.length;
  if(total<5) return false;                                   /* 쌓인 게 없으면 조르지 않는다 */
  if(store.get("backupSnooze")===todayStr()) return false;
  if(!last) return daysBetween(first,todayStr())>=3;          /* 시작 3일 뒤 한 번 */
  return daysBetween(last,todayStr())>=30;                    /* 이후 한 달에 한 번 */
}

/* ============ 📤 하루 요약 공유 ============
   서버 없는 앱이 «공동양육»을 푸는 방법: 실시간 동기화 대신 «오늘 하루»를 통째로 보내준다.
   조부모·시터·배우자에게 카톡으로. 개인정보가 서버를 거치지 않는다는 게 오히려 장점. */
function dayDigest(ds){
  ds=ds||todayStr();
  const L=[], nm=(child&&child.name)||"우리 아이";
  const dt=new Date(ds+"T00:00:00");
  L.push("🦔 "+nm+" — "+(dt.getMonth()+1)+"월 "+dt.getDate()+"일 ("+ageText()+")");
  L.push("");
  /* 잠 */
  const sl=sleepsOn(ds).slice().sort((a,b)=>hm2m(a.s)-hm2m(b.s));
  if(sl.length){
    L.push("🌙 잠 — 합쳐서 "+fmtDur(sleepTotal(ds))+" (낮잠 "+napCount(ds)+"회)");
    sl.forEach(x=>L.push("  "+(x.n?"🌤":"🌙")+" "+x.s+"~"+x.e+" ("+fmtDur(durMin(x))+")"));
  }
  /* 이유식 */
  const p=feed.plan[ds];
  if(p&&p.meals&&p.meals.length){
    L.push("🍚 이유식"+(feed.style==="bowl"?" (죽)":" (토핑)"));
    p.meals.forEach((m,i)=>{ const it=(m.items||[]); if(it.length)L.push("  "+(i+1)+"끼: "+it.join(feed.style==="bowl"?" + ":" · ")); });
    if(p.testItem)L.push("  🧪 새 재료: "+p.testItem+" — 두드러기·구토·설사 있는지 봐주세요");
  }
  /* 관찰 기록 */
  const lg=logs.filter(x=>x.date===ds);
  if(lg.length){
    L.push("✏️ 오늘 본 것");
    lg.forEach(x=>{ const t=(x.output||x.input||"").trim(); if(t)L.push("  · "+t.slice(0,80)); });
  }
  /* 놀이 */
  const pl=playLogs.filter(x=>x.date===ds);
  if(pl.length){
    const names=pl.map(x=>{const q=PLAYS.find(y=>y.n===x.n); return q?q.name:null}).filter(Boolean);
    if(names.length)L.push("🧸 놀이 — "+names.join(", "));
  }
  if(L.length<=2)L.push("(아직 오늘 기록이 없어요)");
  L.push("");
  L.push("— 고슴이 앱에서 보냄");
  return L.join("\n");
}
function shareDay(ds){
  const txt=dayDigest(ds);
  if(navigator.share){
    navigator.share({title:"오늘 하루",text:txt}).catch(()=>copyDigest(txt));
  } else copyDigest(txt);
}
function copyDigest(txt){
  const done=()=>alert("복사했어요!\n카톡에 붙여넣으면 됩니다.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}

const KDST_SRC="한국 영유아발달선별검사(K-DST) 추가질문 — 보건복지부·질병관리청 후원, 대한소아과학회 등 개발. 영유아건강검진에서 실제로 묻는 항목이에요.";
/* CDC 2022 개정: «경고신호» 목록은 폐지되고, 마일스톤 자체가 75%가 하는 일로 바뀌었다 */

const REGRESS="예전에 하던 것을 지금은 하지 않는다면 — 이건 개월수와 상관없이 가장 먼저 봐야 할 신호예요. 다음 검진까지 기다리지 말고 이번 주 안에 소아청소년과에 가보세요. (미국 CDC가 모든 월령에 공통으로 안내하는 항목입니다.)";

function feverNow(){ const m=monthAge(); for(const f of FEVER){ if(m>=f[0]&&m<f[1])return f; } return FEVER[FEVER.length-1]; }
function kdstNow(){ const m=monthAge(); for(const k of KDST){ if(m>=k[0]&&m<k[1])return k; } return null; }
function kdstNext(){ const m=monthAge(); for(const k of KDST){ if(m<k[0])return k; } return null; }

     +'<div style="font-size:14px;font-weight:700;line-height:1.9'+(k?'':';opacity:.75')+'">';
    kn[2].forEach(x=>{h+='· '+esc(x)+'<br>'});
    h+='</div></div>';
  }
  h+='<div class="notice mint" style="font-size:13px">'+esc(CDC_NOTE)+'</div>';
  h+='<div class="footer-note">이 화면은 미국소아과학회·NICE·질병관리청·서울대병원 공개 자료를 옮긴 <b>일반 정보</b>예요. 진단이 아니며, 판단이 서지 않으면 언제든 병원에 연락하는 편이 낫습니다.</div>';
  return h+'</div>';
}

  +'<div class="card pop"><h2 class="hd">진료실용 요약</h2>'
  +'<label class="f">걱정되는 게 있으신가요?</label><textarea id="smWorry" placeholder="예: 옹알이가 3주 전부터 줄어든 것 같아요">'+esc(store.get("worry",""))+'</textarea>'
  +'<div class="notice" style="font-size:13px">진단이 아니에요. 의사 선생님께 <b>설명할 시간을 줄여주는</b> 용도예요. 함께 인쇄되는 것: 최근 8주 관찰 기록 · 이정표 날짜 · <b>성장 기록과 WHO 백분위</b> · <b>최근 14일 수면</b> · 이유식 이상 반응 · <b>검진에서 묻는 K-DST 항목</b>.</div>'
  +'<button class="pri" onclick="printSummary()">인쇄 / PDF로 저장</button>'
  +'<div class="small" style="margin-top:8px">인쇄 화면에서 「PDF로 저장」을 고르면 파일이 됩니다.</div></div></div>';

function printSummary(){
  const w=$("#smWorry").value.trim();store.set("worry",w);
  const cut=new Date();cut.setDate(cut.getDate()-56);
  const recent=logs.filter(l=>new Date(l.date)>=cut);
  const pc={happy:0,meh:0,sad:0,skip:0};playLogs.forEach(l=>pc[l.res]++);
  let h='<h1>발달 관찰 기록 요약</h1>'
  +'<p>생년월일: '+child.birth+(child.due?' (예정일 '+child.due+', 교정연령 적용)':"")+' · 현재 '+ageText()+'<br>작성일: '+todayStr()+' · 본 요약은 보호자의 가정 관찰 기록이며 진단 자료가 아닙니다.</p>';
  if(w)h+='<h2>보호자가 걱정하는 것</h2><p>'+esc(w)+'</p>';
  h+='<h2>이정표 (보호자 기록)</h2><table><tr><th>항목</th><th>날짜</th><th>참고</th></tr>';
  MILES.forEach(mi=>{h+='<tr><td>'+esc(mi.nm)+'</td><td>'+(miles[mi.k]||"—")+'</td><td>'+esc(mi.line)+'</td></tr>'});
  h+='</table>';
  if(growth.length){
    const P=child.sex?'<th>몸무게 백분위</th><th>키 백분위</th><th>머리 백분위</th>':'';
    h+='<h2>성장 기록'+(child.sex?' (WHO 2006 표준 대비 백분위)':'')+'</h2><table><tr><th>날짜</th><th>키</th><th>몸무게</th><th>머리둘레</th>'+P+'</tr>';
    growth.forEach(g=>{
      let ex='';
      if(child.sex){
        const pw=growthPct(g,'w'), ph=growthPct(g,'h'), pc2=growthPct(g,'c');
        ex='<td>'+(pw?Math.round(pw.pct)+'%':"—")+'</td><td>'+(ph?Math.round(ph.pct)+'%':"—")+'</td><td>'+(pc2?Math.round(pc2.pct)+'%':"—")+'</td>';
      }
      h+='<tr><td>'+g.date+'</td><td>'+(g.h||"—")+'</td><td>'+(g.w||"—")+'</td><td>'+(g.hd||"—")+'</td>'+ex+'</tr>'});
    h+='</table>'+(child.sex?'<p style="font-size:11px">백분위는 WHO Child Growth Standards(2006) LMS 값으로 앱에서 계산한 참고치입니다.</p>':'')}
  /* 수면 — 최근 14일 요약 */
  const sdays=[];
  for(let d=0; d<14; d++){ const ds=addDays(todayStr(),-d); const t2=sleepTotal(ds); if(t2>0) sdays.push({ds,t:t2,n:napCount(ds)}); }
  if(sdays.length){
    const avg=Math.round(sdays.reduce((a,b2)=>a+b2.t,0)/sdays.length);
    const rec2=sleepRange(SLEEP_TOTAL,monthAge());
    h+='<h2>수면 (최근 '+sdays.length+'일 기록)</h2>'
     +'<p>하루 평균 총 수면 <b>'+fmtDur(avg)+'</b>'+(rec2?' · 같은 월령 권장 '+rec2[2]+'~'+rec2[3]+'시간 (미국수면의학회 2016)':'')+'</p>'
     +'<table><tr><th>날짜</th><th>총 수면</th><th>낮잠 횟수</th><th>잠든/깬 시각</th></tr>';
    sdays.forEach(x=>{
      const list=sleepsOn(x.ds).slice().sort((a,b2)=>hm2m(a.s)-hm2m(b2.s)).map(y=>(y.n?"낮 ":"밤 ")+y.s+"~"+y.e).join(", ");
      h+='<tr><td>'+x.ds+'</td><td>'+fmtDur(x.t)+'</td><td>'+x.n+'</td><td>'+esc(list)+'</td></tr>'});
    h+='</table>'}
  /* 검진에서 실제로 묻는 항목 — 부모가 그날 당황하지 않게 */
  const kk=kdstNow();
  if(kk){ h+='<h2>영유아건강검진 발달선별(K-DST) 추가질문 — '+kk[0]+'~'+kk[1]+'개월</h2><ul>';
    kk[2].forEach(x=>{h+='<li>'+esc(x)+'</li>'});
    h+='</ul><p style="font-size:11px">검진 시 실제로 묻는 항목입니다. 해당된다고 생각하시면 진료 시 말씀해 주세요.</p>'; }
  const warns=Object.keys(feed.tried).filter(n=>feed.tried[n].r==="warn");
  if(Object.keys(feed.tried).length){h+='<h2>이유식</h2><p>먹어본 재료: '+Object.keys(feed.tried).join(", ")+'</p>';
    if(warns.length)h+='<p><b>이상 반응이 있었던 재료: '+warns.map(n=>n+"("+feed.tried[n].d+")").join(", ")+'</b></p>'}
  h+='<h2>최근 8주 관찰 기록 ('+recent.length+'건)</h2><table><tr><th>날짜</th><th>자극(해준 것)</th><th>반응(아이가 한 것)</th><th>비고</th></tr>';
  recent.slice(-40).forEach(l=>{h+='<tr><td>'+l.date+'</td><td>'+esc(l.input)+'</td><td>'+esc(l.output)+'</td><td>'+esc(l.note||"")+'</td></tr>'});
  h+='</table><p>놀이 반응 누계: 재밌어함 '+pc.happy+' · 보통 '+pc.meh+' · 관심 없음 '+pc.sad+' · 미수행 '+pc.skip+'</p>'
  +'<p style="font-size:10px">'+esc(DISCLAIMER)+' '+esc(FOOD_DISCLAIMER)+'</p>';
  $("#printArea").innerHTML=h;window.print();
}

let _admTap=0,_admT=null;
function adminTap(){
  _admTap++; clearTimeout(_admT); _admT=setTimeout(()=>{_admTap=0},1600);
  if(_admTap>=5){ _admTap=0; const on=!store.get("admin"); store.set("admin",on); render();
    alert(on?"운영자 메뉴가 열렸어요 (쇼핑 링크 등록)":"운영자 메뉴를 숨겼어요"); }
}
function stSave(){
  child.name=$("#stName").value.trim()||"우리 아이";
  child.birth=$("#stBirth").value||child.birth;
  child.due=$("#stDue").value||null;
  const nd=$("#stDom").value;if(nd!==child.domain){child.domain=nd;domSad=0}
  save();go("home");
}
function savePartner(){
  const lines=$("#stPartner").value.split("\n").map(l=>l.trim()).filter(Boolean);
  const map={};let bad=0;
  lines.forEach(l=>{const i=l.indexOf("=");if(i<1){bad++;return}
    const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();
    if(!/^https:\/\/(link\.coupang\.com|www\.coupang\.com)/.test(v)){bad++;return}
    map[k]=v});
  shop.partner=map;shop.on=Object.keys(map).length>0;save();
  alert("저장했어요. 등록 "+Object.keys(map).length+"건"+(bad?" (형식이 안 맞아 건너뜀 "+bad+"건)":""));render();
}
function exportData(){
  store.set("lastBackup",todayStr());
  const data={v:2,exported:todayStr(),child,logs,playLogs,playState,miles,feed,growth,appts,shop};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="고슴이_백업_"+todayStr()+".json";a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.child||!Array.isArray(d.logs))throw 0;
    child=d.child;logs=d.logs;playLogs=d.playLogs||[];playState=d.playState||{};miles=d.miles||{};
    feed=d.feed||{tried:{},watch:null,plan:{},stageOv:null};growth=d.growth||[];appts=d.appts||[];shop=d.shop||{partner:{},on:false};
    save();alert("불러왔어요. 기록 "+logs.length+"건.");go("home")}
   catch(e){alert("파일을 읽지 못했어요. 이 앱에서 내보낸 백업인지 확인해주세요.")}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("모든 기록을 지우고 처음으로 돌아가요. 내보내기 백업은 하셨나요?"))return;
  child=null;logs=[];playLogs=[];playState={};miles={};sugCache={};domSad=0;
  feed={tried:{},watch:null,plan:{},stageOv:null};growth=[];appts=[];shop={partner:{},on:false};
  if(store.ok)Object.keys(localStorage).filter(k=>k.startsWith("siwoo.")).forEach(k=>localStorage.removeItem(k));
  store.mem={};ob={step:1,birth:"",due:"",preterm:false,domain:null,reason:null};
  go("onboard");
}

/* ============ 렌더 ============ */
function render(){
  applyNight();
  header();navSync();
  const m=$("#main");
  if(!child){view="onboard";m.innerHTML=vOnboard();navSync();return}
  switch(view){
    case"onboard":m.innerHTML=vOnboard();break;
    case"worry":m.innerHTML=vWorry();break;
    case"home":m.innerHTML=vHome();break;
    case"plays":m.innerHTML=vPlays();break;
    case"browse":m.innerHTML=vBrowse();break;
    case"card":m.innerHTML=vCard();break;
    case"feedback":m.innerHTML=vFeedback();break;
    case"food":m.innerHTML=vFood();break;
    case"foodSetup":m.innerHTML=vFoodSetup();break;
    case"foodDetail":m.innerHTML=vFoodDetail();break;
    case"planDay":m.innerHTML=vPlanDay();break;
    case"log":m.innerHTML=vLog();break;
    case"sleep":m.innerHTML=vSleep();break;
    case"er":m.innerHTML=vER();break;
    case"cal":logMode="cal";view="log";m.innerHTML=vLog();break;
    case"map":m.innerHTML=vMap();break;
    case"summary":m.innerHTML=vSummary();break;
    case"settings":m.innerHTML=vSettings();break;
    default:m.innerHTML=vHome();
  }
}
/* 구버전(v3/v4)이 만든 식단 자동 이행 — 끼니 조합 로테이션이 없는 옛 형식이면 오늘부터 다시 생성 */
(function(){
  if(!child) return;
  const p=feed.plan&&feed.plan[todayStr()];
  if(p && p.stock===undefined && curStage().k!=="pre"){ buildMonth(todayStr()); render(); }

render();
if("serviceWorker" in navigator && location.protocol==="https:"){
  try{ navigator.serviceWorker.register("sw.js"); }catch(e){}
}
